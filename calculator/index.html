  const t = tr(), e = t.enq;
  const isNew = !row;
  const r = row || { number:'', client:'', description:'', enquiry_date:'',
                     sent_to_supplier:false, supplier:'', quoted_to_client:false,
                     status:'Vykdoma', po_date:'', cost_ex_vat:null, price_ex_vat:0,
                     delivered:false, paid:false, paid_date:'', invoice_no:'',
                     owner:'', note:'' };
  const val = v => esc(v == null ? '' : v);
  const dlg = document.createElement('dialog');
  dlg.className = 'enq-dialog';
  dlg.innerHTML = `<form method="dialog" class="enq-form">
      <h2>${esc(isNew ? e.add.replace(/^\+\s*/, '') : e.edit)}</h2>
      <div class="enq-grid">
        <label>${esc(e.number)}<input name="number" required value="${val(r.number)}"></label>
        <label>${esc(e.client)}<input name="client" value="${val(r.client)}"></label>
        <label class="wide">${esc(e.description)}<input name="description" value="${val(r.description)}"></label>
        <label>${esc(e.date)}<input type="date" name="enquiry_date" value="${val(r.enquiry_date)}"></label>
        <label>${esc(e.supplier)}<input name="supplier" value="${val(r.supplier)}" list="enqSupList"></label>
        <datalist id="enqSupList">${enqDistinct('supplier').map(v =>
          `<option value="${esc(v)}">`).join('')}</datalist>
        <label>${esc(e.status)}<select name="status">${ENQ_STATUSES.map(v =>
          `<option value="${esc(v)}"${v === r.status ? ' selected' : ''}>${esc(e.st[v] || v)}</option>`
        ).join('')}</select></label>
        <label>${esc(e.poDate)}<input type="date" name="po_date" value="${val(r.po_date)}"></label>
        <label>${esc(e.cost)}<input type="number" step="0.01" name="cost_ex_vat"
          value="${val(r.cost_ex_vat)}" placeholder="—" title="${esc(e.costHint)}"></label>
        <label>${esc(e.sell)}<input type="number" step="0.01" name="price_ex_vat"
          value="${val(r.price_ex_vat)}"></label>
        <label class="wide enq-live"><span>${esc(e.margin)}</span>
          <output id="enqMargin">&mdash;</output></label>
        <label>${esc(e.invoice)}<input name="invoice_no" value="${val(r.invoice_no)}"></label>
        <label>${esc(e.paidDate)}<input type="date" name="paid_date" value="${val(r.paid_date)}"></label>
        <label>${esc(e.owner)}<input name="owner" value="${val(r.owner)}"></label>
        <label class="check"><input type="checkbox" name="sent_to_supplier"${
          r.sent_to_supplier ? ' checked' : ''}> ${esc(e.toSupplier)}</label>
        <label class="check"><input type="checkbox" name="quoted_to_client"${
          r.quoted_to_client ? ' checked' : ''}> ${esc(e.quoted)}</label>
        <label class="check"><input type="checkbox" name="delivered"${
          r.delivered ? ' checked' : ''}> ${esc(e.delivered)}</label>
        <label class="check"><input type="checkbox" name="paid"${
          r.paid ? ' checked' : ''}> ${esc(e.paid)}</label>
        <label class="wide">${esc(e.note)}<input name="note" value="${val(r.note)}"></label>
      </div>
      <div class="enq-actions">
        ${isNew ? '' : `<button type="button" value="del" class="ghost danger">${esc(e.del)}</button>`}
        <span class="spacer"></span>
        <button type="button" value="cancel" class="ghost">${esc(e.cancel)}</button>
        <button type="submit" class="primary">${esc(e.save)}</button>
      </div>
    </form>`;
  document.body.appendChild(dlg);

  const form = dlg.querySelector('form');
  const close = () => { dlg.close(); dlg.remove(); };
  dlg.querySelector('[value=cancel]').addEventListener('click', close);
  const delBtn = dlg.querySelector('[value=del]');
  if(delBtn) delBtn.addEventListener('click', async () => {
    if(!confirm(e.confirmDel)) return;
    try {
      await CLOUD.enquiryRemove(r.id);
      state.enquiries = (state.enquiries || []).filter(x => x.id !== r.id);
      close(); render();
    } catch(err){ toast(err.message); }
  });

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    const d = new FormData(form);
    const payload = {
      number: (d.get('number') || '').toString().trim(),
      client: (d.get('client') || '').toString().trim(),
      description: (d.get('description') || '').toString().trim(),
      enquiry_date: d.get('enquiry_date') || null,
      sent_to_supplier: !!d.get('sent_to_supplier'),
      supplier: (d.get('supplier') || '').toString().trim(),
      quoted_to_client: !!d.get('quoted_to_client'),
      status: d.get('status'),
      po_date: d.get('po_date') || null,
      /* Sent as a string so an empty box arrives as '' and the function's
         nullif keeps it unknown. Number('') is 0, which would silently claim
         the part cost nothing and the whole sale was margin. */
      cost_ex_vat: (d.get('cost_ex_vat') || '').toString().trim(),
      price_ex_vat: Number(d.get('price_ex_vat') || 0),
      delivered: !!d.get('delivered'),
      paid: !!d.get('paid'),
      paid_date: d.get('paid_date') || null,
      invoice_no: (d.get('invoice_no') || '').toString().trim(),
      owner: (d.get('owner') || '').toString().trim(),
      note: (d.get('note') || '').toString().trim()
    };
    try {
      if(isNew){
        const saved = await CLOUD.enquiryInsert(payload);
        if(saved) state.enquiries = [saved].concat(state.enquiries || []);
      } else {
        const saved = await CLOUD.enquirySave(r.id, r.rev, payload);
        /* null is the optimistic-concurrency answer, not a failure: somebody
           saved between this row being read and this form being submitted */
        if(!saved){ toast(e.conflict); return; }
        state.enquiries = (state.enquiries || []).map(x => x.id === saved.id ? saved : x);
      }
      close(); render();
    } catch(err){ toast(err.message); }
  });

  /* The point of the two boxes is the difference between them, so it is shown
     while they are being typed rather than after a save and a re-render. */
  const live = () => {
    const c = form.cost_ex_vat.value.trim(), p = Number(form.price_ex_vat.value || 0);
    const out = dlg.querySelector('#enqMargin');
    if(c === '' || isNaN(Number(c))){ out.textContent = '—'; out.className = ''; return; }
    const m = p - Number(c);
    out.textContent = fmt(m) + (p ? '   ' + pct(m / p) : '');
    out.className = m >= 0 ? 'pos' : 'neg';
  };
  form.cost_ex_vat.addEventListener('input', live);
  form.price_ex_vat.addEventListener('input', live);
  live();

  dlg.addEventListener('cancel', close);
  dlg.showModal();
  const first = dlg.querySelector('input');
  if(first) first.focus();
}

/* ---- editing without leaving the table ----
   216 rows arrived with no supplier price, and they are the reason this exists:
   opening a dialog, tabbing to one box, saving and waiting for a re-render, two
   hundred times, is not a thing anybody will finish. A cost cell becomes an
   input where it stands; the paid tick toggles on one click. */
function enqCostCell(td, row){
  if(td.querySelector('input')) return;
  const before = td.innerHTML;
  const val = row.cost_ex_vat == null ? '' : row.cost_ex_vat;
  td.innerHTML = `<input type="number" step="0.01" class="enq-cell" value="${esc(val)}">`;
  const input = td.querySelector('input');
  input.focus(); input.select();

  let closed = false;
  const cancel = () => { if(closed) return; closed = true; td.innerHTML = before; };
  const commit = () => {
    if(closed) return; closed = true;
    const raw = input.value.trim();
    /* An emptied box means "I do not know", which is what null is for. Left
       exactly as it was, nothing is sent at all. */
    const same = (raw === '' && row.cost_ex_vat == null) ||
                 (raw !== '' && Number(raw) === Number(row.cost_ex_vat));
    td.innerHTML = before;
    if(!same) enqPatch(row, { cost_ex_vat: raw });
  };
  input.addEventListener('keydown', ev => {
    if(ev.key === 'Enter'){ ev.preventDefault(); commit(); }
    if(ev.key === 'Escape'){ ev.preventDefault(); cancel(); }
  });
  input.addEventListener('blur', commit);
}

/* One changed field, sent as the whole row, because save_enquiry takes a whole
   row -- and the row it takes is the one on screen, so a field this patch does
   not mention is written back unchanged rather than blanked. */
async function enqPatch(row, change){
  const t = tr();
  const payload = {
    number: row.number, client: row.client, description: row.description,
    enquiry_date: row.enquiry_date, sent_to_supplier: !!row.sent_to_supplier,
    supplier: row.supplier, quoted_to_client: !!row.quoted_to_client,
    status: row.status, po_date: row.po_date,
    cost_ex_vat: row.cost_ex_vat == null ? '' : String(row.cost_ex_vat),
    price_ex_vat: Number(row.price_ex_vat) || 0,
    delivered: !!row.delivered, paid: !!row.paid, paid_date: row.paid_date,
    invoice_no: row.invoice_no, owner: row.owner, note: row.note
  };
  Object.assign(payload, change);
  /* Ticking paid without a date leaves the register unable to say when, so the
     tick fills today in and clearing it takes the date away again. */
  if('paid' in change){
    payload.paid_date = change.paid ? (row.paid_date || new Date().toISOString().slice(0,10)) : null;
  }
  try {
    const saved = await CLOUD.enquirySave(row.id, row.rev, payload);
    if(!saved){ toast(t.enq.conflict); return; }
    state.enquiries = (state.enquiries || []).map(x => x.id === saved.id ? saved : x);
    render();
  } catch(err){
    toast(t.enq.savingFailed + ' — ' + err.message);
  }
}

function enqCsv(){
  const t = tr(), e = t.enq;
  const head = [e.number, e.client, e.description, e.date, e.toSupplier, e.supplier,
                e.quoted, e.daysUnquoted, e.status, e.poDate, e.cost, e.sell, e.margin,
                e.marginPct, e.delivery, e.paid, e.paidDate, e.invoice, e.owner];
  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[",;\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [head.map(cell).join(';')];
  enqSorted(enqRows()).forEach(r => lines.push([
    r.number, r.client, r.description, r.enquiry_date,
    r.sent_to_supplier ? t.yes : t.no, r.supplier,
    r.quoted_to_client ? t.yes : t.no, r.days_unquoted, e.st[r.status] || r.status,
    r.po_date,
    r.cost_ex_vat == null ? '' : Number(r.cost_ex_vat).toFixed(2),
    (Number(r.price_ex_vat) || 0).toFixed(2),
    r.margin_eur == null ? '' : Number(r.margin_eur).toFixed(2),
    r.margin_pct == null ? '' : (Number(r.margin_pct) * 100).toFixed(1),
    r.delivered ? e.delivered : e.undelivered,
    r.paid ? e.paid : e.unpaid, r.paid_date, r.invoice_no, r.owner
  ].map(cell).join(';')));
  /* BOM: Excel opens a UTF-8 csv as Latin-1 without it, and this register is
     full of Lithuanian names and euro signs */
  download('enquiries.csv', '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
}

/* ---- grouped bar chart (SVG) ---- */
function wireChart(){
  const t = tr(), d = computeDash(proj()), P = PAL_SCREEN;
  const cats = costCats(t, d);
  const put = (id, html) => { const el = $('#' + id); if(el) el.innerHTML = html; };
  put('chartWaterfall', chartWaterfall(waterfallSteps(t, d), P, {title: t.dash.waterfallTitle}));
  put('chartVariance', chartVariance(cats, P, {title: t.dash.varianceTitle, empty: t.dash.noData}));
  put('chartComposition', chartComposition(
        cats.map(c => ({ l: c.l, v: c.a })), P,
        {title: t.dash.compositionTitle, empty: t.dash.noData}));
  const max = Math.max(1, ...cats.flatMap(c=>[c.p,c.a]));
  const W = 560, labelW = 155, chartW = W - labelW - 60;
  const barH = 13, gap = 3, groupPad = 14, groupH = barH*2 + gap + groupPad;
  const H = cats.length*groupH + 30;
  const step = niceStep(max/4);
  let gridLines = '';
  for(let v=0; v<=max*1.02; v+=step){
    const x = labelW + (v/max)*chartW;
    gridLines += `<line x1="${x}" y1="4" x2="${x}" y2="${H-24}" stroke="var(--grid)" stroke-width="1"/>
      <text x="${x}" y="${H-8}" font-size="9.5" fill="var(--ink-3)" text-anchor="middle">${fmt(v,0)}</text>`;
  }
  let bars = '';
  cats.forEach((c,i)=>{
    const y = i*groupH + 6;
    const wp = Math.max(0,(c.p/max)*chartW), wa = Math.max(0,(c.a/max)*chartW);
    bars += `<text x="${labelW-12}" y="${y+barH+gap/2+4}" font-size="10.5" fill="var(--ink-2)" text-anchor="end">${esc(c.l)}</text>`;
    bars += bar(labelW, y, wp, barH, 'var(--series-1)');
    bars += bar(labelW, y+barH+gap, wa, barH, 'var(--series-2)');
    bars += `<rect class="bar-hit" x="${labelW}" y="${y-2}" width="${chartW}" height="${barH*2+gap+4}"
      data-tip="${esc(c.l)}|${fmt(c.p)}|${fmt(c.a)}"/>`;
  });
  put('chartCosts', `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(tr().dash.chartTitle)}">
    ${gridLines}

function niceStep(raw){

/* Spreadsheet keys. Tab already moves across a row; this adds movement DOWN a
   column, which is how anyone actually fills one of these in. */
function gridKeys(e){
  const el = e.target;
  if(!el.matches || !el.matches('table[data-sheet] input, table[data-sheet] select')) return;
  const dir = e.key === 'Enter' ? (e.shiftKey ? -1 : 1)
            : e.key === 'ArrowDown' ? 1
            : e.key === 'ArrowUp' ? -1 : 0;
  if(e.key === 'Escape'){ el.blur(); return; }
  if(!dir) return;
  /* let arrows move the caret inside a text field; Enter always navigates */
  if(dir && e.key !== 'Enter' && el.tagName === 'INPUT' && el.type === 'text') return;
  e.preventDefault();
  const tb = el.closest('table[data-sheet]');
  const r = +el.dataset.r, k = el.dataset.k;
  const next = tb.querySelector(`[data-r="${r + dir}"][data-k="${k}"]`);
  if(next){ next.focus(); if(next.select) next.select(); }
}

var lastDeleted = null;
const MENU_ACTS = {
  new(){
    const p = newProject(state.lang, state.projects.length+1);
    state.projects.push(p); state.currentId = p.id; state.tab = 'card';
  },
  dup(){
    const src = JSON.parse(JSON.stringify(proj()));
    src.id = uid(); src.card.projectId += '-COPY';
    state.projects.push(src); state.currentId = src.id;
  },
  lock(){
    const p = proj(); if(!p) return false;
    if(!p.locked && !confirm(tr().confirmClose)) return false;
    p.locked = !p.locked; touch();
  },
  del(){
    if(!confirm(tr().confirmDel)) return false;
    lastDeleted = state.currentId;
    state.projects = state.projects.filter(p=>p.id !== state.currentId);
    if(!state.projects.length) state.projects.push(newProject(state.lang, 1));
    state.currentId = state.projects[0].id;
  },
  async refresh(){
    await cloudRefresh();
    return 'noop';               /* it just re-read; nothing local to save */
  },
  async signout(){
    await CLOUD.signOut();
    /* The reload resets CAN_MONEY on its own, but not localStorage. On a
       shared machine the cached copy still held the previous session's
       projects -- revenue included, if that person was allowed to see it --
       and the next person to sign in would be rendered from it until the pull
       landed. The server copy is the record; the cache is only there to make a
       reload instant, and it is worth nothing once its owner has left. */
    try { localStorage.removeItem(LS_KEY); localStorage.removeItem(ROLE_KEY); } catch(e){}
    location.reload();
    return 'noop';
  },
  printProject(){ printProjectReport(); return 'noop'; },
  printCompany(){ printCompanyReport(); return 'noop'; },
  /* these three change no state, so they neither save nor re-render */
  csv(){ exportCsv(); return 'noop'; },
  json(){ exportJson(); return 'noop'; },
  import(){ $('#importFile').click(); return 'noop'; }
};

$('#projMenu').addEventListener('click', async e=>{

  closeMenu(false);
  /* Export and import change nothing here, so they take no snapshot at all --
     truncating the stack afterwards would misbehave at the 80-entry cap,
     where a push silently drops the oldest entry first. */
  const act = b.dataset.act;
  const changes = !(act === 'csv' || act === 'json' || act === 'import'
                    || act === 'signout' || act === 'refresh'
                    || act === 'printProject' || act === 'printCompany');
  if(changes) pushUndo(null);
  lastDeleted = null;
  const r = await MENU_ACTS[act]();
  if(r === false || r === 'noop'){
    if(changes) undoStack.pop();          /* declined at the confirm */
    return;
  }
  saveState(); render();

  /* The server hands out the id, so a new or duplicated project is inserted
     rather than pushed, and only then does it have one. */
  if(CLOUD.on){
    try {
      if(act === 'new' || act === 'dup') await cloudCreate(proj());
      else if(act === 'del' && lastDeleted) await CLOUD.remove(lastDeleted);

  }
});

function recalcSheet(key, tb){
  const cfg = sheetConfigs()[key], rows = proj()[key], s = proj().settings;
  rows.forEach((r,i)=>{
    cfg.cols.forEach(col=>{
      if(col.t!=='calc') return;
      const cell = tb.querySelector(`[data-calc="${key}-${i}-${col.k}"]`);
      if(!cell) return;
      const v = col.f(r, s);
      cell.textContent = col.fmt ? col.fmt(v) : fmt(v);
      cell.className = 'calc num ' + (col.cls ? col.cls(v) : '');
    });
  });
  cfg.cols.forEach(col=>{
    if(!col.sum) return;
    const cell = tb.querySelector(`[data-total="${key}-${col.k}"]`);
    if(!cell) return;
    cell.textContent = fmt(rows.reduce((a,r)=> a + (col.t==='calc' ? col.f(r,s) : N(r[col.k])), 0));
  });
}

function exportCsv(){
  if(!canMoney()) return;
  const t = tr(), p = proj(), d = computeDash(p), dd = t.dash;
  const q = v => `"${String(v??'').replace(/\u00a0/g,' ').replace(/"/g,'""')}"`;
  const num = v => (v===null||v===undefined||isNaN(v)) ? '' : String(Math.round(v*100)/100).replace('.',','); // EU decimal comma
  const L = [];
  const row = arr => L.push(arr.map(q).join(';'));
  row(['LITPROFIT', t.appSub]); row([]);
  row([t.tabs.card]);
  row([t.card.projectId,p.card.projectId]); row([t.card.client,p.card.client]); row([t.card.site,p.card.site]);
  row([t.card.pm,p.card.pm]); row([t.card.start,p.card.start]); row([t.card.end,p.card.end]);
  row([t.card.days, projectDays(p.card)??'']); row([t.card.currency,p.settings.currency]);
  L.push([q(t.card.contract),num(p.card.contract)].join(';'));
  L.push([q(t.card.advance),num(p.card.advance)].join(';'));
  row([t.card.terms, p.card.terms??'']); row([]);
  const sheets = sheetConfigs();
  for(const key of ['revenue','labor','subs','travel','materials','logistics']){
    const cfg = sheets[key];
    row([t.tabs[key]]);
    row(cfg.cols.map(c=>c.l));
    p[key].forEach(r=>{
      L.push(cfg.cols.map(col=>{
        if(col.t==='calc'){ const v = col.f(r,p.settings); return col.fmt ? q(col.fmt(v)) : num(v); }
        if(col.t==='sel') return q(col.opts==='bool' ? (r[col.k]?t.yes:t.no) : (t.statuses[r[col.k]]||r[col.k]));
        if(col.t==='num') return num(r[col.k]);
        return q(cellVal(key, r, col.k));
      }).join(';'));
    });
    row([]);
  }
  row([dd.title]);
  row([dd.kpi, dd.plan, dd.actual]);
  const kv = [[dd.totalRevenue,d.revPlan,d.revActual],[dd.laborCost,d.laborPlan,d.laborActual],[t.tabs.subs,d.subsPlan,d.subsActual],[t.tabs.travel,d.travelPlan,d.travelActual],[t.tabs.materials,d.matPlan,d.matActual],[t.tabs.logistics,d.logPlan,d.logActual],[dd.directCost,d.directPlan,d.directActual],[dd.adminOh,d.adminPlan,d.adminActual],[dd.contingency,d.contPlan,d.contActual],[dd.totalCost,d.costPlan,d.costActual],[dd.grossProfit,d.profitPlan,d.profitActual]];
  kv.forEach(r=>L.push([q(r[0]),num(r[1]),num(r[2])].join(';')));
  L.push([q(dd.margin),q(pct(d.marginPlan)),q(pct(d.marginActual))].join(';'));
  download(`LITPROFIT_${p.card.projectId||'project'}.csv`, '﻿'+L.join('\r\n'), 'text/csv;charset=utf-8');
}

$('#importFile').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = async ()=>{
    let s;
    try{
      s = JSON.parse(rd.result);
      if(!s.projects || !Array.isArray(s.projects)) throw 0;
    }catch(err){ alert('Invalid backup file'); return; }
    if(!confirmDiscard()) return;
    pushUndo(null);            /* an import replaces everything; make it reversible */

    if(CLOUD.on){
      /* This is also the migration route off a browser-only copy, so the
         projects have to reach the server -- saveState() alone would write
         them to localStorage and quietly stop there, since nothing marked
         them as edited. They are ADDED, not merged: a backup carries local
         ids that mean nothing here, and matching them up by project number
         would silently overwrite a colleague's job of the same name. */
      if(!confirm(tr().cloud.importAdds.replace('{n}', s.projects.length))) return;
      const done = [];
      try {
        for(const p of s.projects){
          const row = await CLOUD.insert(cloudPayload(p));
          adopt(p, row); done.push(p);
        }
      } catch(err){
        cloudErr = err.message;
        alert(tr().cloud.importPartial.replace('{n}', done.length)
                                     .replace('{total}', s.projects.length));
      }
      await cloudPull();
      applyTheme(); render(); paintSaveState(cloudErr ? 'error' : null);
      return;
    }

    state = s;
    if(!state.projects.find(p=>p.id===state.currentId)) state.currentId = state.projects[0]?.id;
    migrateDefaults();          /* a backup can predate keyed defaults too */
    saveState(); applyTheme(); render();
  };
  rd.readAsText(f); e.target.value='';
});
function download(name, content, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:mime}));
  a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ================= the report =================
   A document, not a screen dump: brand band, the four figures anyone opens a
   report for, the plan-versus-actual chart, the KPI table, then the detail —
   and only rows that carry a number, because a page of zeroes is noise.

   It goes to paper through the browser's own print dialog, which is also its
   Save as PDF. That is the whole PDF pipeline a static page can honestly have,
   and it produces a better document than any library small enough to embed. */

/* the chart again, in ink rather than on a dark ground */
function printChart(d){
  const t = tr();
  const cats = [
    {l:t.dash.laborCost, p:d.laborPlan, a:d.laborActual},
    {l:t.tabs.subs,      p:d.subsPlan,  a:d.subsActual},
    {l:t.tabs.travel,    p:d.travelPlan,a:d.travelActual},
    {l:t.tabs.materials, p:d.matPlan,   a:d.matActual},
    {l:t.tabs.logistics, p:d.logPlan,   a:d.logActual},
    {l:t.dash.adminOh,   p:d.adminPlan, a:d.adminActual}
  ].filter(c=>c.p || c.a);
  if(!cats.length) return '';
  const max = Math.max(1, ...cats.flatMap(c=>[c.p,c.a]));
  const W=700, labelW=150, chartW=W-labelW-70, barH=11, gap=3, groupH=barH*2+gap+13;
  const H = cats.length*groupH + 26;
  const step = niceStep(max/4);
  let g='';
  for(let v=0; v<=max*1.02; v+=step){
    const x = labelW + (v/max)*chartW;
    g += `<line x1="${x}" y1="2" x2="${x}" y2="${H-20}" stroke="#e2e4ec" stroke-width="1"/>`+
         `<text x="${x}" y="${H-6}" font-size="8" fill="#6b6e85" text-anchor="middle">${fmt(v,0)}</text>`;
  }
  let bars='';
  cats.forEach((c,i)=>{
    const y=i*groupH+4;
    bars += `<text x="${labelW-9}" y="${y+barH+gap/2+3}" font-size="9" fill="#101010" text-anchor="end">${esc(c.l)}</text>`+

/* The browser names a Save-as-PDF file after document.title, so every report
   anyone saved was called "LITPROFIT — Project Calculator.pdf" -- fine once,
   useless by the fifth. Name it for what it is, then put the title back: the
   tab is not called that once the dialog has gone.

   afterprint is the reliable signal and fires on cancel as well as save, but
   it does not fire everywhere, so a timer backs it up. Restoring twice is
   harmless; never restoring leaves the tab misnamed for the session.

   Slashes and colons are stripped because a client name is free text and both
   are illegal in a filename on some systems -- the browser would silently
   mangle the name rather than refuse it. */
const DOC_TITLE = document.title;   /* captured once, at load */
function printAs(name){
  /* Restore to the title the document loaded with, NOT to whatever it happens
     to hold now. Reading it here looked equivalent and is not: print two
     reports in a row and the second call captures the FIRST report's name as
     the "original", so the tab keeps a report name for the rest of the
     session. Caught by printing twice in a row and checking what came back. */
  const prev = DOC_TITLE;
  document.title = String(name).replace(/[\/\\:*?"<>|]+/g, ' ').replace(/\s+/g, ' ').trim();
  let done = false;
  const restore = () => { if(done) return; done = true; document.title = prev;
                          window.removeEventListener('afterprint', restore); };
  window.addEventListener('afterprint', restore);
  setTimeout(restore, 8000);
  window.print();
}

/* ================= sync =================
   Push is per project and only for projects actually edited, so switching
   language or theme never touches the network. */
var PEOPLE = {};
var pushTimer = null, pushing = false, cloudErr = null;
/* A push asked for while one is in flight, and how long to wait before trying
   again after a failure. */
var pushAgain = false, pushBackoff = 0;
const PUSH_RETRY_MIN = 2000, PUSH_RETRY_MAX = 30000;

/* rev, updated_at and updated_by belong to the columns, not to the document */
function cloudPayload(p){
  const out = {};
  Object.keys(p).forEach(k=>{
    if(k !== 'id' && k !== 'rev' && k !== 'updatedAt' && k !== 'updatedBy') out[k] = p[k];
  });
  return out;
}
function adopt(p, row){
  p.id = row.id; p.rev = row.rev;
  p.updatedAt = row.updated_at; p.updatedBy = row.updated_by;
  /* projects_v returns sees_money() as `money` -- the same question asked of
     the same database, so it corroborates the role lookup and keeps the
     remembered value in step with it. */
  if(row.money !== undefined) rememberRole(row.money ? 'manager' : 'staff');
}

function pushSoon(delay){
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushPending, delay === undefined ? 400 : delay);
}

async function pushPending(){
  if(!CLOUD.on || !pendingPush.size) return;
  /* Asked for while one is already in flight: note it and run again at the
     end. Returning silently left the newest edits sitting unsent until
     somebody happened to type something else. */
  if(pushing){ pushAgain = true; return; }
  pushing = true;
  const ids = [...pendingPush];
  pendingPush.clear();
  let failed = false, conflicted = false;
  try {
    for(let i = 0; i < ids.length; i++){
      const id = ids[i];
      const p = state.projects.find(x=>x.id === id);
      if(!p) continue;
      let row;
      try {
        /* `rev` is only ever set by adopt(), so a project without one has
           never reached the server -- created while the connection was down,
           or by a cloudCreate that threw. Updating it would match no row and
           be reported as a conflict with a colleague who does not exist. */
        if(!p.rev){
          const was = p.id;
          row = await CLOUD.insert(cloudPayload(p));
          adopt(p, row);
          if(state.currentId === was) state.currentId = p.id;
          cloudErr = null;
          continue;
        }
        row = await CLOUD.update(p.id, p.rev, cloudPayload(p));
      } catch(e){
        /* Put back EVERYTHING still owed, not only the one that failed. The
           queue was emptied up front, so breaking out with the rest held in a
           local array dropped them: three projects edited, one write refused,
           and two of the three were gone with nothing said. */
        for(let j = i; j < ids.length; j++) pendingPush.add(ids[j]);
        cloudErr = e.message;
        failed = true;
        paintSaveState('error');
        /* A refresh token that has expired is not a network problem, and
           leaving it as "not saved to server" would let somebody type for an
           hour into a tab that can no longer write a thing. */
        if(!CLOUD.signedIn()){ pushing = false; showSignIn(tr().cloud.sessionEnded); return; }
        break;
      }
      if(!row){
        /* Who actually holds the row has to come from the server. p.updatedBy
           is this browser's last known value -- which is usually THIS user,
           from their own previous save -- so reading it named the wrong
           colleague in the one message where that matters most. */
        let holder = null;
        try { const cur = await CLOUD.one(p.id); holder = cur && cur.updated_by; } catch(e){}
        showConflict(p, holder);
        /* One question at a time. Anything still owed goes back on the queue
           and waits, or a second conflict would replace the first dialog and
           the answer would be applied to the wrong project. */
        for(let j = i + 1; j < ids.length; j++) pendingPush.add(ids[j]);
        conflicted = true;
        break;
      }
      adopt(p, row);
      cloudErr = null;
    }
    persist();
  } finally {
    pushing = false;
    if(failed){
      /* Keep trying. A tab stays open for hours and the network comes back;
         waiting for the next keystroke to retry meant the last edits of the
         day never went anywhere. */
      pushBackoff = Math.min(pushBackoff ? pushBackoff * 2 : PUSH_RETRY_MIN, PUSH_RETRY_MAX);
      pushSoon(pushBackoff);
    } else if(conflicted){
      /* The dialog is asking which version to keep, so this work is NOT saved.
         Repainting "Saved" here put a green receipt beside a question about
         losing figures -- the two most contradictory things on the screen. */
      pushBackoff = 0;
      paintSaveState('waiting');
    } else {
      pushBackoff = 0;
      /* Say so when it comes back. The amber warning stayed up after a
         successful retry, so a queue that had drained still read as broken. */
      if(!pendingPush.size && !cloudErr){ savedAt = new Date(); paintSaveState('saved'); }
      if(pushAgain){ pushAgain = false; pushSoon(0); }
    }
  }
}

/* ---------- someone else got there first ---------- */
var conflictProject = null;
function showConflict(p, holder){
  conflictProject = p.id;
  const t = tr(), who = (holder && PEOPLE[holder]) || t.cloud.someone;
  $('#cfTitle').textContent = t.cloud.conflictTitle;
  $('#cfBody').textContent  = t.cloud.conflictBody
    .replace('{who}', who).replace('{project}', p.card.projectId || '');
  $('#cfTheirs').textContent = t.cloud.takeTheirs;
  $('#cfMine').textContent   = t.cloud.keepMine;
  $('#conflict').hidden = false;
}
$('#cfTheirs').addEventListener('click', async ()=>{
  $('#conflict').hidden = true;
  await cloudPull();
  render();
});
$('#cfMine').addEventListener('click', async ()=>{
  $('#conflict').hidden = true;
  /* looked up fresh: any render since could have replaced the object */
  const p = state.projects.find(x=>x.id === conflictProject); if(!p) return;
  const row = await CLOUD.update(p.id, p.rev, cloudPayload(p), true);   /* force */
  if(row){ adopt(p, row); persist(); render(); }
});

/* ---------- put the server back in step with local ----------
   Used after undo and redo, which can move in any direction: a project may
   need creating again (undo of a delete), removing (undo of a create) or
   rewriting. Reading the server's revisions first is what keeps rev owned by
   the database rather than by the undo stack. */
async function cloudReconcile(){
  if(!CLOUD.on) return;
  try {
    const rows = await CLOUD.pull();
    const onServer = {};
    rows.forEach(r=> onServer[r.id] = r);

    for(const r of rows){
      if(!state.projects.some(p=>p.id===r.id)) await CLOUD.remove(r.id);
    }
    for(const p of state.projects){
      const r = onServer[p.id];
      if(!r){
        const was = p.id;
        adopt(p, await CLOUD.insert(cloudPayload(p)));
        if(state.currentId === was) state.currentId = p.id;
        continue;
      }
      p.rev = r.rev;                       /* rev belongs to the row, not the history */
      if(JSON.stringify(r.data) !== JSON.stringify(cloudPayload(p))){
        const row = await CLOUD.update(p.id, p.rev, cloudPayload(p));
        if(row) adopt(p, row); else showConflict(p, r.updated_by);
      }
    }
    pendingPush.clear();
    cloudErr = null;
    persist();
  } catch(e){ cloudErr = e.message; }
  render();
  paintSaveState(cloudErr ? 'error' : null);
}

/* ---------- see what everyone else has done ----------
   Nothing re-read the server after the first load, so a shared tool showed
   every person a private snapshot from whenever they happened to open the
   tab. Pulled when the tab comes back to the front, and on demand from the
   menu. Never while there are edits in flight -- that would throw away what
   is being typed. */
async function cloudRefresh(){
  if(!CLOUD.on || !CLOUD.signedIn()) return;
  /* Somebody is mid-decision about which version to keep. Replacing
     state.projects underneath them would leave the dialog answering for a
     project object that is no longer in the list. */
  if(!$('#conflict').hidden) return;
  try {
    await cloudPull();
    cloudErr = null;
    render();
    paintSaveState();
  } catch(e){
    if(!CLOUD.signedIn()){ showSignIn(tr().cloud.sessionEnded); return; }
    cloudErr = e.message;
    paintSaveState('error');
  }
}

document.addEventListener('visibilitychange', ()=>{
  if(document.hidden) return;
  if(dirty || pendingPush.size || autoTimer) return;
  cloudRefresh();
});

/* ---------- load ---------- */
async function cloudPull(){
  const rows = await CLOUD.pull();
  CLOUD.people().then(m=>{ PEOPLE = m; }).catch(()=>{});
  /* Not awaited with the projects: the register is one screen out of eleven,
     and a slow or missing enquiries table must not hold up the whole app.
     For a staff member the view returns an empty list by design, so an empty
     register and no register look the same here -- which is the point. */
  if(canMoney()){
    CLOUD.enquiries()
      .then(list => { state.enquiries = list; if(state.tab === 'enquiries') render(); })
      .catch(() => { state.enquiries = []; });
  }
  state.projects = rows.map(r=>{
    const p = r.data || {};
    adopt(p, r);
    return p;
  });
  if(!state.projects.length && canMoney()){
    const seed = newProject(state.lang, 1);
    const row = await CLOUD.insert(cloudPayload(seed));
    adopt(seed, row);
    state.projects = [seed];
  }
  if(!state.projects.some(p=>p.id === state.currentId)) state.currentId = state.projects[0].id;
  normaliseProjects();
  migrateDefaults();
  persist();
}

/* ---------- structural changes need the server to hand out the id ---------- */
async function cloudCreate(p){
  const row = await CLOUD.insert(cloudPayload(p));
  const was = p.id;
  adopt(p, row);
  if(state.currentId === was) state.currentId = p.id;
  pendingPush.delete(was);
  persist();
}

/* ---------- sign in ---------- */
function paintSignIn(){
  const t = tr().cloud;
  $('#siSub').textContent    = t.signInSub;
  $('#siEmailL').textContent = t.email;
  $('#siPassL').textContent  = t.password;
  $('#siGo').textContent     = t.signIn;
  $('#siForgot').textContent = t.forgot;
}
function showSignIn(msg){
  paintSignIn();
  $('#siMsg').textContent = msg || '';
  $('#siMsg').classList.remove('ok');
  $('#signin').hidden = false;
  setTimeout(()=>{ const f = $('#siEmail'); if(f) f.focus(); }, 40);
}
$('#signinForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const t = tr().cloud, btn = $('#siGo'), msg = $('#siMsg');
  btn.disabled = true; msg.classList.remove('ok'); msg.textContent = t.signingIn;
  try {
    await CLOUD.signIn($('#siEmail').value.trim(), $('#siPass').value);
    $('#siPass').value = '';
    msg.textContent = '';
    $('#signin').hidden = true;
    await bootCloud();
  } catch(err){
    msg.textContent = /invalid|credential|grant/i.test(err.message) ? t.badLogin : err.message;
  } finally { btn.disabled = false; }
});
$('#siForgot').addEventListener('click', async ()=>{
  const t = tr().cloud, msg = $('#siMsg'), email = $('#siEmail').value.trim();
  if(!email){ msg.classList.remove('ok'); msg.textContent = t.needEmail; return; }
  try { await CLOUD.resetPassword(email); msg.classList.add('ok'); msg.textContent = t.resetSent; }
  catch(err){ msg.classList.remove('ok'); msg.textContent = err.message; }
});

async function bootCloud(){
  if(!CLOUD.signedIn()){ showSignIn(); return; }
  /* Before anything is drawn. CAN_MONEY starts false, so a failure here leaves
     the interface in its restricted state rather than its permissive one --
     which is the right way round for a question about what someone is allowed
     to see. profiles.role defaults to 'staff' in the schema, and role() falls
     back to 'staff' on any error, so every path that is not an affirmative
     'admin' or 'manager' lands in the same place. */
  try { rememberRole(await CLOUD.role()); ROLE_UNKNOWN = false; }
  catch(e){
    /* Do not silently drop a manager to the restricted view on a flaky
       lookup. Keep the last confirmed answer for this paint, and flag it so
       the reason is visible instead of the reports just being gone. */
    ROLE_UNKNOWN = true;
  }
  try {
    /* Anything still queued goes up BEFORE the pull, or the pull replaces
       state.projects wholesale and takes it with it. That is the path where a
       session expires mid-edit: the user is told the work is safe, signs back
       in, and it is silently gone. Sending it first puts it through the normal
       revision check, so a genuine clash still surfaces as a conflict rather
       than being resolved behind their back. */
    if(pendingPush.size) await pushPending();
    await cloudPull();
    cloudErr = null;
  } catch(e){
    /* An expired refresh token is a login problem; anything else is the
       network, and the cached copy is still worth showing. */
    if(!CLOUD.signedIn()){ showSignIn(tr().cloud.sessionEnded); return; }
    /* Except one: the roles release reads projects_v and save_project, which
       do not exist until db/schema.sql is run again. Saying "not saved to
       server" for that would send somebody hunting a network fault that is
       not there. */
    cloudErr = /projects_v|save_project|does not exist|schema cache/i.test(e.message)
      ? tr().cloud.needsSchema : e.message;
  }
  /* A failed role lookup used to just mean fewer buttons, with nothing said.
     Fewer buttons and no reason is indistinguishable from the tool being
     broken -- which is exactly how it was reported. */
  if(ROLE_UNKNOWN && !cloudErr) cloudErr = tr().cloud.roleUnknown;
  render();
  paintSaveState(cloudErr ? 'error' : null);
}

/* ================= init ================= */
normaliseProjects();
migrateDefaults();
migrateTheme();
applyTheme();
render();
paintSaveState();
/* With no database configured this never runs and nothing above changes. */
if(CLOUD.on) bootCloud();
</script>
</body>

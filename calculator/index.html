function tr(){ return T[state.lang] || T.en; }
function proj(){ return state.projects.find(p=>p.id===state.currentId) || state.projects[0]; }
const N = v => (v===null||v===undefined||v===''||isNaN(+v)) ? 0 : +v;

/* ================= formulas (mirroring the Excel workbook) ================= */
const F = {
  // Labor: F=D*E, H=F*(1+G), K=H+I*J, M=L-K
  laborGross: r => N(r.hours)*N(r.rate),
  laborEmpCost: (r,s) => F.laborGross(r)*(1+N(s.burden)),
  laborPlan: (r,s) => F.laborEmpCost(r,s) + N(r.travelDays)*N(s.allowance),
  laborDiff: (r,s) => N(r.actual) - F.laborPlan(r,s),
  // Subcontractors: I=C*D+E+F+G+H, K=J-I
  subPlan: r => N(r.hours)*N(r.rate)+N(r.travel)+N(r.accom)+N(r.materials)+N(r.other),
  subDiff: r => N(r.actual) - F.subPlan(r),
  // Travel & Materials: E=C*D, G=F-E
  qtyPlan: r => N(r.qty)*N(r.unit),
  qtyDiff: r => N(r.actual) - F.qtyPlan(r),
  // Revenue / Logistics: diff = actual - plan
  simpleDiff: r => N(r.actual) - N(r.plan)
};
function projectDays(c){
  if(!c.start || !c.end) return null;
  const d = Math.round((new Date(c.end) - new Date(c.start))/86400000) + 1; // =End-Start+1
  return isNaN(d) ? null : d;
}
// Dashboard totals — exactly the workbook's Dashboard sheet
function computeDash(p){
  const s = p.settings;
  const sum = (arr, fn) => arr.reduce((a,r)=>a+fn(r), 0);
  const revPlan = sum(p.revenue, r=>N(r.plan));                                   // E4 =SUM(Revenue!C4:C43)
  const revActual = sum(p.revenue, r=>N(r.actual))                                 // F4 =SUM(Revenue!D)+SUM(Materials!I)+SUM(Logistics!G)
                  + sum(p.materials, r=>N(r.rebillAmt))
                  + sum(p.logistics, r=>N(r.rebill));
  const laborPlan = sum(p.labor, r=>F.laborPlan(r,s));                             // E5 =SUM(Labor!K)
  const laborActual = sum(p.labor, r=>N(r.actual));                                // F5 =SUM(Labor!L)
  const subsPlan = sum(p.subs, F.subPlan), subsActual = sum(p.subs, r=>N(r.actual));
  const travelPlan = sum(p.travel, F.qtyPlan), travelActual = sum(p.travel, r=>N(r.actual));
  const matPlan = sum(p.materials, F.qtyPlan), matActual = sum(p.materials, r=>N(r.actual));
  const logPlan = sum(p.logistics, r=>N(r.plan)), logActual = sum(p.logistics, r=>N(r.actual));
  const directPlan = laborPlan+subsPlan+travelPlan+matPlan+logPlan;                // E10 =SUM(E5:E9)
  const directActual = laborActual+subsActual+travelActual+matActual+logActual;
  const adminPlan = directPlan*N(s.admin), adminActual = directActual*N(s.admin);  // E11 =E10*Settings!B8
  const contPlan = directPlan*N(s.contingency), contActual = 0;                    // E12 =E10*Settings!B7 ; F12 =0
  const costPlan = directPlan+adminPlan+contPlan, costActual = directActual+adminActual+contActual; // E13 =SUM(E10:E12)
  const profitPlan = revPlan-costPlan, profitActual = revActual-costActual;        // E14 =E4-E13
  const marginPlan = revPlan ? profitPlan/revPlan : 0;                             // E15 =IFERROR(E14/E4,0)
  const marginActual = revActual ? profitActual/revActual : 0;
  return { revPlan,revActual,laborPlan,laborActual,subsPlan,subsActual,travelPlan,travelActual,
    matPlan,matActual,logPlan,logActual,directPlan,directActual,adminPlan,adminActual,
    contPlan,contActual,costPlan,costActual,profitPlan,profitActual,marginPlan,marginActual,
    target:N(s.targetMargin), onTarget: marginActual >= N(s.targetMargin) };       // H7 =IF(H5>=H4,...)
}

/* ================= extra metrics =================
   computeDash() is a faithful copy of the workbook's Dashboard sheet and stays
   that way -- anything the spreadsheet did not calculate goes here instead, so
   the two can be checked against each other line by line forever. */
function computeExtra(p){
  const sum = (arr, fn) => arr.reduce((a, r) => a + fn(r), 0);
  const d = computeDash(p);
  const invoiced = sum(p.revenue, r => (r.status === 'invoiced' || r.paid) ? N(r.actual) : 0);
  const paid     = sum(p.revenue, r => r.paid ? N(r.actual) : 0);
  const hours    = sum(p.labor, r => N(r.hours));
  const crew     = p.labor.filter(r => String(r.name || '').trim() || N(r.hours)).length;
  const rebill   = sum(p.materials, r => N(r.rebillAmt)) + sum(p.logistics, r => N(r.rebill));
  return {
    invoiced, paid,
    outstanding: d.revActual - paid,
    hours, crew, rebill,
    travelDays: sum(p.labor, r => N(r.travelDays)),
    contract: N(p.card.contract),
    advance: N(p.card.advance),
    /* what an hour of this job actually cost, all in */
    costPerHour: hours ? d.costActual / hours : 0,
    /* how much of the contract has been billed at all */
    billedShare: N(p.card.contract) ? invoiced / N(p.card.contract) : 0
  };
}

/* ================= charts =================
   One set of drawing functions, taking the palette as an argument. The screen
   and the printed report used to have their own copy of the bar chart with the
   colours written in twice, which is two things to keep in step and one of
   them only ever seen on paper. */
const PAL_SCREEN = { plan:'var(--series-1)', actual:'var(--series-2)', grid:'var(--grid)',
  axis:'var(--baseline)', ink:'var(--ink-2)', faint:'var(--ink-3)',
  good:'var(--good-text)', bad:'var(--critical)',
  seq:['var(--series-1)','var(--series-2)','var(--good)','var(--warning)','var(--critical)','var(--ink-3)'] };
const PAL_PRINT = { plan:'#3452c4', actual:'#c9722c', grid:'#e3e5ee',
  axis:'#b9bcca', ink:'#2b2d42', faint:'#6b6e85',
  good:'#1b7a4b', bad:'#c0392b',
  seq:['#3452c4','#c9722c','#1b7a4b','#b7791f','#c0392b','#6b6e85'] };

function svgOpen(w, h, title){
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" role="img" aria-label="${esc(title||'')}">`;
}
function niceMax(v){ return v <= 0 ? 1 : v; }

/* plan against actual, one pair per category */
function chartGrouped(cats, pal, opt){
  const o = opt || {}, title = o.title || '';
  const max = niceMax(Math.max(0, ...cats.flatMap(c => [c.p, c.a])));
  const W = 560, labelW = o.labelW || 155, chartW = W - labelW - 60;
  const barH = 13, gap = 3, groupH = barH * 2 + gap + 14;
  const H = cats.length * groupH + 30;
  const step = niceStep(max / 4);
  let g = '';
  for(let v = 0; v <= max * 1.02; v += step){
    const x = labelW + (v / max) * chartW;
    g += `<line x1="${x}" y1="4" x2="${x}" y2="${H-24}" stroke="${pal.grid}" stroke-width="1"/>`
       + `<text x="${x}" y="${H-8}" font-size="9.5" fill="${pal.faint}" text-anchor="middle">${fmt(v,0)}</text>`;
  }
  let bars = '';
  cats.forEach((c, i) => {
    const y = i * groupH + 6;
    const wp = Math.max(0, (c.p / max) * chartW), wa = Math.max(0, (c.a / max) * chartW);
    bars += `<text x="${labelW-12}" y="${y+barH+gap/2+4}" font-size="10.5" fill="${pal.ink}" text-anchor="end">${esc(c.l)}</text>`
         +  `<rect x="${labelW}" y="${y}" width="${wp}" height="${barH}" fill="${pal.plan}"/>`
         +  `<rect x="${labelW}" y="${y+barH+gap}" width="${wa}" height="${barH}" fill="${pal.actual}"/>`;
    if(o.hit) bars += `<rect class="bar-hit" x="${labelW}" y="${y-2}" width="${chartW}" height="${barH*2+gap+4}" data-tip="${esc(c.l)}|${fmt(c.p)}|${fmt(c.a)}"/>`;
  });
  return svgOpen(W, H, title) + g
    + `<line x1="${labelW}" y1="4" x2="${labelW}" y2="${H-24}" stroke="${pal.axis}" stroke-width="1"/>`
    + bars + '</svg>';
}

/* where the money went: one bar, each cost as its share of the whole */
function chartComposition(parts, pal, opt){
  const o = opt || {};
  const live = parts.filter(x => x.v > 0);
  const total = live.reduce((a, x) => a + x.v, 0);
  const W = 560, H = 46;
  if(!total) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  let x = 0, bar = '', key = '';
  live.forEach((s, i) => {
    const w = (s.v / total) * W, col = pal.seq[i % pal.seq.length];
    bar += `<rect x="${x.toFixed(1)}" y="0" width="${Math.max(0.5, w).toFixed(1)}" height="26" fill="${col}"/>`;
    /* only label a slice wide enough to hold the number */
    if(w > 46) bar += `<text x="${(x + w/2).toFixed(1)}" y="17" font-size="9.5" fill="#fff" text-anchor="middle" font-weight="600">${pct(s.v/total)}</text>`;
    key += `<span><i style="background:${col}"></i>${esc(s.l)} <b>${fmt(s.v)}</b></span>`;
    x += w;
  });
  return svgOpen(W, H - 20, o.title) + bar + '</svg>'
       + `<div class="legend legend-wrap">${key}</div>`;
}

/* what blew the budget: actual minus plan, worst first, either side of zero */
function chartVariance(cats, pal, opt){
  const o = opt || {};
  const live = cats.map(c => ({ l: c.l, v: c.a - c.p })).filter(c => Math.abs(c.v) > 0.005);
  if(!live.length) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  live.sort((a, b) => Math.abs(b.v) - Math.abs(a.v));
  const max = niceMax(Math.max(...live.map(c => Math.abs(c.v))));
  const W = 560, labelW = 150, half = (W - labelW - 70) / 2, zero = labelW + half;
  const rowH = 22, H = live.length * rowH + 22;
  let bars = `<line x1="${zero}" y1="2" x2="${zero}" y2="${H-18}" stroke="${pal.axis}" stroke-width="1"/>`;
  live.forEach((c, i) => {
    const y = i * rowH + 4, w = (Math.abs(c.v) / max) * half;
    /* over budget is bad for a COST, so the sign is read that way round */
    const over = c.v > 0, col = over ? pal.bad : pal.good;
    /* The longest bar reaches the axis, and a figure written outside it then
       runs straight into the category name. Past about three quarters of the
       track the number goes inside the bar instead, in white. */
    const inside = w > half * 0.72;
    const tx = over ? (inside ? zero + w - 6 : zero + w + 6)
                    : (inside ? zero - w + 6 : zero - w - 6);
    const anchor = over ? (inside ? 'end' : 'start') : (inside ? 'start' : 'end');
    bars += `<text x="${labelW-12}" y="${y+13}" font-size="10.5" fill="${pal.ink}" text-anchor="end">${esc(c.l)}</text>`
         +  `<rect x="${over ? zero : zero - w}" y="${y}" width="${Math.max(0.5, w)}" height="15" fill="${col}"/>`
         +  `<text x="${tx.toFixed(1)}" y="${y+12}" font-size="9.5" fill="${inside ? '#fff' : col}" text-anchor="${anchor}" ${inside?'font-weight="600"':''}>${over?'+':''}${fmt(c.v,0)}</text>`;
  });
  return svgOpen(W, H, o.title) + bars + '</svg>';
}

/* revenue, then every cost taken off it, then what is left */
function chartWaterfall(steps, pal, opt){
  const o = opt || {};
  const W = 560, H = 190, padL = 8, padB = 42, padT = 10;
  let run = 0;
  const pts = steps.map(s => {
    const from = run;
    run += s.v;
    return { l: s.l, from, to: run, v: s.v, total: s.total };
  });
  const hi = niceMax(Math.max(...pts.map(p => Math.max(p.from, p.to)), 0));
  const lo = Math.min(0, ...pts.map(p => Math.min(p.from, p.to)));
  const span = niceMax(hi - lo);
  const plotH = H - padB - padT;
  const yOf = v => padT + (hi - v) / span * plotH;
  const bw = (W - padL * 2) / pts.length * 0.62, gapw = (W - padL * 2) / pts.length;
  let out = `<line x1="${padL}" y1="${yOf(0)}" x2="${W-padL}" y2="${yOf(0)}" stroke="${pal.axis}" stroke-width="1"/>`;
  pts.forEach((s, i) => {
    const x = padL + i * gapw + (gapw - bw) / 2;
    const y1 = yOf(Math.max(s.from, s.to)), y2 = yOf(Math.min(s.from, s.to));
    const col = s.total ? (s.to >= 0 ? pal.plan : pal.bad) : (s.v < 0 ? pal.actual : pal.good);
    out += `<rect x="${x.toFixed(1)}" y="${y1.toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1.5, y2-y1).toFixed(1)}" fill="${col}"/>`
        +  `<text x="${(x+bw/2).toFixed(1)}" y="${(y1-4).toFixed(1)}" font-size="9" fill="${pal.ink}" text-anchor="middle">${fmt(s.total ? s.to : s.v, 0)}</text>`;
    /* two short lines rather than one long one, or the labels collide */
    String(s.l).split(' ').reduce((yy, word, wi, arr) => {
      if(wi > 1) return yy;
      const text = wi === 1 && arr.length > 2 ? arr.slice(1).join(' ') : word;
      out += `<text x="${(x+bw/2).toFixed(1)}" y="${H-padB+14+wi*11}" font-size="9" fill="${pal.faint}" text-anchor="middle">${esc(text)}</text>`;
      return yy;
    }, 0);
  });
  return svgOpen(W, H, o.title) + out + '</svg>';
}

/* When was this job last touched, by ANYONE. `modified` is written by
   whichever browser did the editing, so on a shared database it says nothing
   about a colleague's work -- a project someone else saved an hour ago read as
   never edited. The server's own stamp wins where there is one. */
function lastEdited(p){
  if(p.updatedAt){ const t = Date.parse(p.updatedAt); if(!isNaN(t)) return t; }
  return p.modified || 0;
}

/* ---- company level ---- */

/* margin per job against the target line: the one picture that says which
   jobs are carrying the year and which are being carried */
function chartProjectMargins(rows, pal, opt){
  const o = opt || {};
  if(!rows.length) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  const list = rows.slice().sort((a, b) => b.d.marginActual - a.d.marginActual);
  const W = 560, labelW = 150, chartW = W - labelW - 70;
  const rowH = 20, H = list.length * rowH + 26;
  const vals = list.flatMap(r => [r.d.marginActual, r.d.target]);
  const hi = niceMax(Math.max(0.01, ...vals)), lo = Math.min(0, ...vals);
  const span = niceMax(hi - lo), zero = labelW + (0 - lo) / span * chartW;
  let out = `<line x1="${zero}" y1="2" x2="${zero}" y2="${H-20}" stroke="${pal.axis}" stroke-width="1"/>`;
  list.forEach((r, i) => {
    const y = i * rowH + 4, m = r.d.marginActual;
    const x = labelW + (Math.min(m, 0) - lo) / span * chartW;
    const w = Math.abs(m) / span * chartW;
    const col = m >= r.d.target ? pal.good : pal.bad;
    const tx = labelW + (r.d.target - lo) / span * chartW;
    out += `<text x="${labelW-10}" y="${y+12}" font-size="10" fill="${pal.ink}" text-anchor="end">${esc(r.p.card.projectId || '—')}</text>`
        +  `<rect x="${x.toFixed(1)}" y="${y}" width="${Math.max(0.5, w).toFixed(1)}" height="13" fill="${col}"/>`
        +  `<line x1="${tx.toFixed(1)}" y1="${y-1}" x2="${tx.toFixed(1)}" y2="${y+14}" stroke="${pal.faint}" stroke-width="1" stroke-dasharray="2 2"/>`
        +  `<text x="${(x+w+7).toFixed(1)}" y="${y+11}" font-size="9" fill="${col}">${pct(m)}</text>`;
  });
  return svgOpen(W, H, o.title) + out + '</svg>';
}

/* which clients the revenue actually comes from */
function chartByClient(rows, pal, opt){
  const o = opt || {}, by = new Map();
  rows.forEach(r => {
    const k = String(r.p.card.client || '').trim() || (o.unnamed || '—');
    by.set(k, (by.get(k) || 0) + r.d.revActual);
  });
  const list = [...by.entries()].map(([l, v]) => ({ l, v }))
    .filter(x => x.v > 0).sort((a, b) => b.v - a.v).slice(0, 8);
  if(!list.length) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  const max = niceMax(list[0].v);
  const W = 560, labelW = 150, chartW = W - labelW - 80;
  const rowH = 20, H = list.length * rowH + 12;
  let out = '';
  list.forEach((c, i) => {
    const y = i * rowH + 4, w = (c.v / max) * chartW;
    out += `<text x="${labelW-10}" y="${y+12}" font-size="10" fill="${pal.ink}" text-anchor="end">${esc(c.l)}</text>`
        +  `<rect x="${labelW}" y="${y}" width="${Math.max(0.5, w).toFixed(1)}" height="13" fill="${pal.plan}"/>`
        +  `<text x="${(labelW+w+7).toFixed(1)}" y="${y+11}" font-size="9" fill="${pal.faint}">${fmt(c.v,0)}</text>`;
  });
  return svgOpen(W, H, o.title) + out + '</svg>';
}

/* ================= formatting ================= */
const LOCALES = {en:'en-GB', lt:'lt-LT', ru:'ru-RU'};
function fmt(n, dec=2){
  if(n===null||n===undefined||isNaN(n)) return '';
  return new Intl.NumberFormat(LOCALES[state.lang]||'en-GB',{minimumFractionDigits:0,maximumFractionDigits:dec}).format(n);
}
function money(n){ return n===null||isNaN(n) ? '' : fmt(n)+' '+(proj().settings.currency||''); }
/* A non-breaking space, because "8.5 %" split across two lines wherever a
   percentage sat at the end of a line -- the % landing alone under the number
   in the report's summary cards. The two CSV exports put a plain space back,
   since a spreadsheet cell should not carry U+00A0. */
function pct(n){ return fmt(n*100,1)+'\u00a0%'; }
function esc(s){ return String(s??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function diffCls(v){ return v>0.005 ? 'pos' : (v<-0.005 ? 'neg' : ''); }

/* ================= sheet configs (generic table engine) ================= */
/* What the client is charged is revenue, wherever it happens to be typed --
   the rebill columns are marked `money` and the server strips them from a
   staff member's copy, so rendering them would print empty cells beside a
   heading that asks a question they cannot answer. */
function sheetConfigs(){
  const raw = sheetConfigsAll();
  if(canMoney()) return raw;
  Object.keys(raw).forEach(k=>{ raw[k] = Object.assign({}, raw[k], { cols: raw[k].cols.filter(c=>!c.money) }); });
  return raw;
}
function sheetConfigsAll(){
  const c = tr().cols, s = proj().settings;
  return {
    revenue: { key:'revenue', cols:[
      {k:'cat',t:'text',l:c.category,w:'12%',ac:1},
      {k:'desc',t:'text',l:c.description,w:'18%',ac:1},
      {k:'plan',t:'num',l:c.planRev,sum:true},
      {k:'actual',t:'num',l:c.actRev,sum:true},
      {k:'_diff',t:'calc',l:c.diff,f:F.simpleDiff,sum:true,cls:diffCls},
      {k:'status',t:'sel',l:c.status,opts:'status'},
      {k:'invoice',t:'text',l:c.invoice,w:'9%'},
      {k:'paid',t:'sel',l:c.paid,opts:'bool'}
    ]},

/* ================= suggestions =================
   The same crew, the same three subcontractors, the same yard, job after job
   -- and every one of them retyped in full. Each text column marked `ac` in
   sheetConfigs is fed back as a datalist built from what has already been
   entered, across ALL projects rather than only this one, which is the whole
   point: the value of the list is that it remembers the last job.

   Opt-in per column on purpose. Invoice numbers are unique by definition and
   free-text notes are not worth suggesting, so neither carries the flag. */
const AC_CARD = ['client','site','pm'];
const AC_MAX = 40;

function suggestions(){
  const out = {};
  const add = (id, v) => {
    if(v === null || v === undefined) return;
    v = String(v).trim();
    if(!v) return;
    const m = out[id] || (out[id] = new Map());
    m.set(v, (m.get(v) || 0) + 1);
  };
  const cfgs = sheetConfigs();
  const acCols = {};
  Object.keys(cfgs).forEach(k=> acCols[k] = cfgs[k].cols.filter(c=>c.ac));
  state.projects.forEach(p=>{
    AC_CARD.forEach(k=> add('card-' + k, p.card && p.card[k]));
    Object.keys(acCols).forEach(key=>{
      (p[key] || []).forEach(r=> acCols[key].forEach(col=> add(key + '-' + col.k, cellVal(key, r, col.k))));
    });
  });
  return out;
}

/* Most-used first, then alphabetical, so the common answer is the first one
   the browser offers rather than whatever happens to sort first. */
function datalists(ids){
  const all = suggestions();
  return ids.map(id=>{
    const m = all[id];
    if(!m || !m.size) return '';
    const vals = [...m.entries()]
      .sort((a,b)=> b[1] - a[1] || a[0].localeCompare(b[0]))
      .slice(0, AC_MAX);
    return `<datalist id="dl-${id}">${vals.map(v=>`<option value="${esc(v[0])}"></option>`).join('')}</datalist>`;
  }).join('');
}

/* ================= what this person may see =================
   The server has already decided: a redacted row arrives with money=false and
   simply has no revenue in it. This flag only stops the interface offering
   things that would be empty -- it is not the permission, it is the manners.
   With no database configured everyone is the owner of their own browser. */
/* Starts FALSE with a database attached. It used to start true and wait to be
   corrected by the `money` column on the first project row that arrived, which
   is wrong twice: the interface offers every money view for as long as the
   request is in flight, and a staff member who can see no projects is never
   corrected at all -- no row, no correction, and the flag stays true for the
   whole session. A permission that defaults to granted and waits to be revoked
   is not a permission.

   The figures themselves were never exposed: projects_v redacts revenue, the
   contract, the advance, the target margin and both rebill fields before they
   leave Postgres, and the app has no privilege on public.projects at all. This
   is the interface catching up with what the server already enforces --
   without it staff were shown margin and profit rows computed from redacted
   input, which is a different bug wearing the same clothes. */
var CAN_MONEY = false;
/* Fail closed, but not fail forgetful.

   Starting false and waiting for the server is right for a permission. It is
   wrong for the FIRST PAINT: init calls render() before bootCloud() has asked
   anything, so a manager reloading the page got a calculator with no reports,
   no exports and no Revenue tab until a round-trip finished -- and if the
   round-trip was slow, or the lookup failed, that state was simply where they
   stayed. That is the state you hit. Before this gate existed CAN_MONEY
   defaulted true and the reports were there instantly, so it was a regression
   I introduced.

   So the last role the server confirmed is remembered and used to paint the
   first frame, then overwritten by whatever the server says this time. The
   figures are not at stake either way: projects_v strips revenue, the contract,
   the advance, the target margin and the rebills before they leave Postgres,
   and the app has no privilege on public.projects at all. This flag decides
   which controls to offer, not what anyone is allowed to read. */
var ROLE_KEY = 'litprofit_role';
try {
  var lastRole = localStorage.getItem(ROLE_KEY);
  if(lastRole === 'admin' || lastRole === 'manager') CAN_MONEY = true;
} catch(e){}
var ROLE_UNKNOWN = false;   /* the lookup failed -- say so rather than restrict silently */

function rememberRole(role){
  CAN_MONEY = role === 'admin' || role === 'manager';
  try {
    if(CAN_MONEY) localStorage.setItem(ROLE_KEY, role);
    else localStorage.removeItem(ROLE_KEY);
  } catch(e){}
}
function canMoney(){ return !CLOUD.on || CAN_MONEY; }

/* ================= rendering ================= */
const $ = sel => document.querySelector(sel);
/* The register is not a project tab. Every other tab here is a sheet of ONE
   job -- its labour, its materials, its revenue -- and the enquiry register is
   the company's order book: a different subject on a different timescale that
   happens to share a login. Sitting in the same row it read as one more page
   of the job in front of you. It lives in the overflow menu now, which is
   where this app already keeps the things that are about the company rather
   than the project. */
const ALL_TABS = ['portfolio','dashboard','card','revenue','labor','subs','travel','materials','logistics','settings'];
/* Portfolio and Dashboard are the company's position, Revenue is the company's
   income, and Settings holds the target margin. None of them is an employee's
   business, and all four would be blank or misleading with the figures gone. */
const COST_TABS = ['card','labor','subs','travel','materials','logistics'];
function tabList(){ return canMoney() ? ALL_TABS : COST_TABS; }

/* Which of the two subjects is on screen. Derived from the tab rather than
   stored beside it: two pieces of state that must agree is two pieces of state
   that eventually will not. */
function section(){ return state.tab === 'enquiries' ? 'enquiries' : 'projects'; }

function renderSections(){
  const t = tr(), el = $('#sections');
  if(!el) return;
  /* An employee has no register and no company figures, so there is no choice
     to offer and a switch with one option is furniture. */
  if(!canMoney()){ el.hidden = true; return; }
  el.hidden = false;
  const cur = section();
  const item = (k, label) =>
    `<button role="tab" data-section="${k}" aria-selected="${cur === k}"
       class="${cur === k ? 'active' : ''}">${esc(label)}</button>`;
  /* "Enquiry register" is the screen's own heading and too long to sit in a
     switch beside one word. The switch names the subject; the page names
     itself. */
  el.innerHTML = item('projects', t.secProjects) + item('enquiries', t.secEnquiries);
  /* The picker and the tab strip are the project subject's own row. */
  const row = $('#tabrow');
  if(row) row.hidden = cur !== 'projects';

}

function renderChrome(){
  const t = tr();
  document.documentElement.lang = state.lang;
  document.querySelector('[data-i18n=appSub]').textContent = t.appSub;
  const lk = !!(proj() && proj().locked);
  document.documentElement.classList.toggle('is-locked', lk);
  /* the button prints what is on screen: the portfolio is the company */
  /* One button with one name. It printed "Project report" or "Company report"
     depending on the tab, which meant the label changed under the cursor and
     still could not say "register". What it prints is whatever is on screen;
     what it is called is what it produces. */
  $('#btnPrint').hidden = !canMoney();
  $('#btnPrint').textContent = t.reportPdf;
  $('#btnPrint').title = state.tab === 'enquiries' ? t.enq.report
                        : state.tab === 'portfolio' ? t.printCompany : t.printProject;
  $('#langSel').value = state.lang;

  const dark = currentTheme()==='dark';
  const themeLabel = dark ? t.themeLight : t.themeDark;
  const bt = $('#btnTheme');
  bt.innerHTML = dark ? ICON.sun : ICON.moon;
  bt.title = themeLabel; bt.setAttribute('aria-label', themeLabel);

  const bm = $('#btnMenu');
  bm.title = t.menuLabel; bm.setAttribute('aria-label', t.menuLabel);
  $('#projMenu').innerHTML = menuItems(t, lk);
  const sel = $('#projectSel');
  sel.innerHTML = state.projects.map(p=>`<option value="${p.id}"${p.id===state.currentId?' selected':''}>${esc(p.card.projectId)}${p.card.client?' — '+esc(p.card.client):''}</option>`).join('');
  /* A tab that is gone cannot stay selected -- a staff member whose last
     session ended on the dashboard would open to a blank main. */
  const tabs = tabList();
  /* The register has no button in this strip -- it is the other section -- so
     it must not be treated as an unknown tab and thrown back to Portfolio.
     It is still gated on canMoney(), the same as every tab carrying a figure. */
  const off = tabs.indexOf(state.tab) === -1 && !(state.tab === 'enquiries' && canMoney());
  if(off) state.tab = tabs[0];
  renderSections();
  $('#tabs').innerHTML = tabs.map(k=>`<button data-tab="${k}" class="${state.tab===k?'active':''}">${t.tabs[k]}</button>`).join('');
  /* Ten sheets, and on a 390px screen three of them fit. Nothing ever scrolled
     the strip, so opening Materials left the strip sitting at Portfolio and
     the sheet you were actually on was off-screen -- on a phone there was no
     way to tell where you were. Bring the active tab into view. `nearest`
     rather than `center` so this is a no-op on a desktop where they all fit. */
  const act = $('#tabs .active');
  if(act && act.scrollIntoView){
    /* An instant jump gives no clue which direction the strip moved, so the
       tabs either side change without explanation. Sliding it is the one
       thing here that earns motion: spatial consistency, and it is the strip
       correcting itself rather than a response to a click, so the 300ms bar
       for UI feedback does not apply the same way. Honour reduced motion --
       the correction still has to happen, it just happens at once. */
    const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    act.scrollIntoView({block:'nearest', inline:'nearest',
                        behavior: calm ? 'auto' : 'smooth'});
  }
}

/* Ordered by how often it is reached for, and separated so the destructive
   one cannot be hit on the way to Export. */

  const item = (act, label, cls) =>

  /* Creating, duplicating, closing and deleting a job are a manager's, and the
     server refuses them anyway. Both reports and both exports carry revenue,

     interesting half missing. */

      `<div class="menu-head">${esc(t.grpData)}</div>`,
      item('refresh', t.cloud.refresh),
      item('signout', t.cloud.signOut)

  return [
    `<div class="menu-head">${esc(t.grpProject)}</div>`,
    item('new', t.newProj),
    item('dup', t.dupProj),
    item('lock', locked ? t.reopenProj : t.closeProj),
    '<div class="menu-sep"></div>',
    `<div class="menu-head">${esc(t.grpData)}</div>`,
    item('printProject', t.printProject),
    item('printCompany', t.printCompany),

    item('csv', t.csv),

    item('import', t.importJson + '\u2026'),   /* the ellipsis says a file dialog follows */
    '<div class="menu-sep"></div>',
    item('del', t.delProj, 'danger'),

  ].join('');

const ICON = {

};

/* Hidden on the portfolio, which is every project at once, and on the
   dashboard, which already says all of this in full. */
/* The strip reads PLAN MARGIN / ACTUAL MARGIN / BELOW TARGET for the selected
   job. On the portfolio and the dashboard those figures are already on the
   page; on the register it is answering a question nobody asked, about a
   project that is not on screen. paintPulse decides this, so the section
   switch does not also get a say -- render() calls paintPulse afterwards and
   the second opinion would simply be overwritten. */
const PULSE_OFF = {portfolio:1, dashboard:1, enquiries:1};

function paintPulse(){
  const el = $('#pulse');
  if(!el) return;
  const p = proj();
  /* every figure on this strip is a margin or a profit */
  const hide = !p || !canMoney() || PULSE_OFF[state.tab];
  if(el.hidden !== hide){ el.hidden = hide; measureChrome(); }
  if(hide) return;

  const t = tr(), dd = t.dash, d = computeDash(p);

  /* Plan AND actual, not actual alone. Showing only actuals meant a job being
     planned -- where every actual column is still empty by definition -- read
     0 % and BELOW TARGET in red for the whole of the phase where this strip is
     most useful. A dash, not a zero, where nothing has been entered: an
     untouched project should look untouched rather than catastrophic. */
  const started = !!(d.revActual || d.costActual);
  const planned = !!(d.revPlan || d.costPlan);
  const dash = '\u2014';

  /* "·" joins the two labels instead of a space: PLAN · MARGIN reads as two
     tags in Lithuanian and Russian too, where a two-noun phrase would not
     agree. */
  const cell = (a, b, value, cls, optional) =>
    `<span${optional ? ' class="pu-opt"' : ''}><i>${esc(a)}${b ? ' \u00b7 ' + esc(b) : ''}</i>` +
    `<b${cls ? ' class="' + cls + '"' : ''}>${value}</b></span>`;
  const marginCls = v => v >= d.target ? 'pos' : 'neg';

  let html =
    cell(dd.plan, t.puMargin, planned ? pct(d.marginPlan) : dash, planned ? marginCls(d.marginPlan) : '') +
    cell(dd.actual, t.puMargin, started ? pct(d.marginActual) : dash, started ? marginCls(d.marginActual) : '') +
    cell(dd.target, '', pct(d.target), '', true) +
    cell(dd.plan, dd.profit, planned ? fmt(d.profitPlan) : dash, planned && d.profitPlan < 0 ? 'neg' : '', true) +
    cell(dd.actual, dd.profit, started ? fmt(d.profitActual) : dash, started && d.profitActual < 0 ? 'neg' : '', true) +
    '<span class="sp"></span>';

  /* The verdict follows whichever figure is real, and says which one it read,
     so it can never be mistaken for the other. Nothing entered, no verdict. */
  if(started || planned){
    const m = started ? d.marginActual : d.marginPlan;
    const on = m >= d.target;
    html += `<span class="pu-basis"><i>${esc(started ? dd.actual : dd.plan)}</i>` +
            `<span class="pf-chip ${on ? 'ok' : 'bad'}">${esc(on ? dd.onTarget : dd.belowTarget)}</span></span>`;
  }
  el.innerHTML = html;
}

/* ============================================================
   DROPDOWNS
   ------------------------------------------------------------
   A native <select> opens the operating system's own list: white, rounded,
   system type, sitting on top of a dark technical instrument like a sticker.
   It is the one control on the page the design cannot reach.

   The real <select> stays in the DOM and keeps its id, its value and every
   handler already bound to it -- the app reads .value in a dozen places and
   listens for 'change' in a dozen more, and none of that should have to know
   this exists. It is taken out of the tab order and covered by a button that
   mirrors it; choosing writes the value back and dispatches 'change', so from
   the application's side nothing has changed at all.

   The list is appended to <body> and positioned fixed, because half of these
   live inside table cells with their own scrolling and clipping, and a popup
   inside an overflow container is a popup with a corner cut off.
   ============================================================ */
var NICE_OPEN = null;

function niceClose(focusBack){
  if(!NICE_OPEN) return;
  const { pop, host } = NICE_OPEN;
  NICE_OPEN = null;
  pop.remove();
  host.setAttribute('aria-expanded', 'false');
  if(focusBack) host.focus();
}

function niceLabel(sel){
  const o = sel.options[sel.selectedIndex];
  return o ? o.textContent : '';
}

function niceOpen(sel, host){
  niceClose(false);
  const pop = document.createElement('div');
  pop.className = 'nice-pop';
  pop.setAttribute('role', 'listbox');
  pop.innerHTML = [...sel.options].map((o, i) =>
    `<button role="option" data-i="${i}" aria-selected="${i === sel.selectedIndex}"
       class="${i === sel.selectedIndex ? 'on' : ''}"${o.disabled ? ' disabled' : ''}>${
       esc(o.textContent)}</button>`).join('');
  document.body.appendChild(pop);

  /* On a phone it is a sheet across the bottom, not a box pinned to a 63px
     button. Anchored, a sixty-four-item list came out 943px tall in a 664px
     window and there was nowhere to put it; as a sheet the position is not a
     calculation at all, and the rows land under the thumb rather than at the
     top of the screen. */
  const narrow = window.innerWidth < 620;
  if(narrow){
    pop.classList.add('nice-sheet');
  } else {
    const r = host.getBoundingClientRect();
    const h = pop.offsetHeight;
    /* Below by default, above when there is no room below and more above -- a
       list that opens off the bottom of the window is a list you scroll the
       page to read, and the page under it is what you were choosing for. */
    const below = window.innerHeight - r.bottom;
    const up = below < h + 8 && r.top > below;
    pop.style.left = Math.max(8, Math.min(r.left, window.innerWidth - pop.offsetWidth - 8)) + 'px';
    pop.style.minWidth = r.width + 'px';
    pop.style.top = up ? Math.max(8, r.top - h - 4) + 'px' : (r.bottom + 4) + 'px';
    pop.style.maxHeight = Math.max(120, (up ? r.top : below) - 12) + 'px';
  }

  host.setAttribute('aria-expanded', 'true');
  NICE_OPEN = { pop, host, sel };

  const items = [...pop.querySelectorAll('button:not([disabled])')];
  const cur = pop.querySelector('button.on') || items[0];
  if(cur){ cur.focus(); cur.scrollIntoView({ block: 'nearest' }); }

  const pick = b => {
    sel.selectedIndex = +b.dataset.i;
    /* bubbles, because some of these are listened for on a container rather
       than on the element itself */
    sel.dispatchEvent(new Event('change', { bubbles: true }));
    niceClose(true);
  };
  pop.addEventListener('click', e => {
    const b = e.target.closest('button[role=option]'); if(b) pick(b);
  });
  pop.addEventListener('keydown', e => {
    const i = items.indexOf(document.activeElement);
    if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){
      e.preventDefault();
      const n = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[n].focus(); items[n].scrollIntoView({ block: 'nearest' });
    } else if(e.key === 'Home' || e.key === 'End'){
      e.preventDefault(); (e.key === 'Home' ? items[0] : items[items.length - 1]).focus();
    } else if(e.key === 'Enter' || e.key === ' '){
      e.preventDefault(); if(i >= 0) pick(items[i]);
    } else if(e.key === 'Escape' || e.key === 'Tab'){
      e.preventDefault(); niceClose(true);
    } else if(e.key.length === 1){
      /* type-ahead, the one thing a native select does that people rely on
         without noticing */
      const c = e.key.toLowerCase();
      const from = items.slice(i + 1).concat(items.slice(0, i + 1));
      const hit = from.find(b => b.textContent.trim().toLowerCase().startsWith(c));
      if(hit){ hit.focus(); hit.scrollIntoView({ block: 'nearest' }); }
    }
  });
}

function enhanceSelects(root){
  (root || document).querySelectorAll('select').forEach(sel => {
    let host = sel.nextElementSibling;
    if(!host || !host.classList || !host.classList.contains('nice')){
      host = document.createElement('button');
      host.type = 'button';
      host.className = 'nice';
      host.setAttribute('aria-haspopup', 'listbox');
      host.setAttribute('aria-expanded', 'false');
      sel.after(host);
      sel.classList.add('nice-native');
      /* out of the tab order, but still focusable programmatically and still
         the element the rest of the app talks to */
      sel.tabIndex = -1;
      sel.setAttribute('aria-hidden', 'true');
      host.addEventListener('click', e => {
        e.preventDefault(); e.stopPropagation();
        if(NICE_OPEN && NICE_OPEN.host === host) niceClose(true); else niceOpen(sel, host);
      });
      host.addEventListener('keydown', e => {
        if(e.key === 'ArrowDown' || e.key === 'Enter' || e.key === ' '){
          e.preventDefault(); niceOpen(sel, host);
        }
      });
    }
    if(sel.title && !host.title) host.title = sel.title;
    host.disabled = sel.disabled;
    /* the label is re-read every pass: the app sets .value directly in places
       and never tells anybody */
    const label = niceLabel(sel);
    if(host.dataset.label !== label){
      host.dataset.label = label;
      host.innerHTML = `<span>${esc(label)}</span>${ICON_CHEV}`;
    }
  });
}

const ICON_CHEV = '<svg viewBox="0 0 12 12" aria-hidden="true" class="nice-chev">' +
  '<path d="M2.5 4.5 6 8l3.5-3.5" fill="none" stroke="currentColor" ' +
  'stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';

document.addEventListener('click', e => {
  if(NICE_OPEN && !e.target.closest('.nice-pop') && !e.target.closest('.nice')) niceClose(false);
});
window.addEventListener('resize', () => niceClose(false));
/* capture: a scroll inside a table does not bubble, and the popup is fixed, so
   it would otherwise sit still while the control it belongs to slides away */
window.addEventListener('scroll', () => niceClose(false), true);

function render(){
  renderChrome();
  const m = $('#main');
  /* The register is company-wide, not project-scoped, so it is dispatched
     before the guard below: it has something to show on an account with no
     projects at all, and every other view here would throw on that account. */
  if(state.tab === 'enquiries'){
    m.innerHTML = viewEnquiries();
    m.dataset.view = 'sheet';
    wireEnquiries();
    paintPulse(); measureChrome();
    /* This branch returns before the end of the function, so anything added
       down there never runs for the register -- which is how seven of its nine
       dropdowns stayed native while the two in the chrome were replaced. */
    enhanceSelects();
    return;
  }
  /* Nothing to show and nothing this person may do about it. Every view below
     dereferences proj(), so without this the page throws rather than saying so. */
  if(!proj()){
    m.innerHTML = `<div class="card"><h2 class="sheet">${esc(tr().pfTitle)}</h2>
      <p class="muted">${esc(tr().cloud.noProjects)}</p></div>`;
    m.dataset.view = 'page';
    paintPulse(); measureChrome(); enhanceSelects();
    return;
  }
  if(state.tab==='portfolio') m.innerHTML = viewPortfolio();
  else if(state.tab==='dashboard') m.innerHTML = viewDashboard();
  else if(state.tab==='card') m.innerHTML = viewCard();
  else if(state.tab==='settings') m.innerHTML = viewSettings();
  else m.innerHTML = viewSheet(state.tab);
  /* the six data sheets plus the portfolio are tables and get the wider column */
  m.dataset.view = (state.tab==='dashboard'||state.tab==='card'||state.tab==='settings') ? 'page' : 'sheet';
  if(state.tab==='dashboard') wireChart();
  paintPulse();
  measureChrome();
  paintSaveState();
  enhanceSelects();
}

/* ---- generic sheet table ---- */
function viewSheet(key){
  const t = tr(), cfg = sheetConfigs()[key], rows = proj()[key];
  /* A closed project is read-only at the MARKUP level, not merely greyed out —
     disabled inputs cannot be typed into, pasted into, or reached by the
     keyboard navigation, so there is no route back in. */
  const ro = proj().locked ? ' disabled' : '';
  const opts = {
    status: Object.entries(t.statuses).map(([v,l])=>({v,l})),
    bool: [{v:'0',l:t.no},{v:'1',l:t.yes}]
  };
  let head = cfg.cols.map(col=>
    `<th class="${col.t==='num'||col.t==='calc'?'num':''}"${col.w?` style="width:${col.w}"`:''}>${esc(col.l)}</th>`
  ).join('') + '<th></th>';
  let body = rows.map((r,i)=>{
    /* Every cell carries its own column name. On a phone the heading row is
       1200px to the left of the value it belongs to, so the card layout puts
       the label beside the field instead -- and it has to come from somewhere
       the CSS can reach. */
    let tds = cfg.cols.map(col=>{
      const L = ` data-label="${esc(col.l)}"`;
      if(col.t==='text') return `<td${L}><input type="text"${ro}${col.ac?` list="dl-${key}-${col.k}"`:''} data-r="${i}" data-k="${col.k}" value="${esc(cellVal(key, r, col.k))}"></td>`;
      if(col.t==='num') return `<td class="num"${L}><input type="number"${ro} step="any" data-r="${i}" data-k="${col.k}" value="${r[col.k]??''}"></td>`;
      if(col.t==='sel'){
        const cur = col.opts==='bool' ? (r[col.k]?'1':'0') : r[col.k];
        return `<td${L}><select${ro} data-r="${i}" data-k="${col.k}" data-opts="${col.opts}">${opts[col.opts].map(o=>`<option value="${o.v}"${o.v===cur?' selected':''}>${esc(o.l)}</option>`).join('')}</select></td>`;
      }
      const v = col.f(r, proj().settings);
      const cls = col.cls ? col.cls(v) : '';
      return `<td class="calc num ${cls}"${L} data-calc="${key}-${i}-${col.k}">${col.fmt?col.fmt(v):fmt(v)}</td>`;
    }).join('');
    return `<tr>${tds}<td class="rowacts" style="white-space:nowrap">`+ (ro ? '' :
      `<button class="rowbtn" data-dup="${i}" title="${esc(t.dupRow)}">⧉</button>`+
      `<button class="rowbtn" data-del="${i}" title="${esc(t.delRow)}">×</button>`) + `</td></tr>`;
  }).join('');
  let totals = cfg.cols.map(col=>{
    if(!col.sum) return '<td></td>';
    const v = rows.reduce((a,r)=> a + (col.t==='calc' ? col.f(r,proj().settings) : N(r[col.k])), 0);
    return `<td class="num" data-label="${esc(col.l)}" data-total="${key}-${col.k}">${fmt(v)}</td>`;
  }).join('');
  return `${lockBar()}${noticeBar()}<div class="card">
    <h2 class="sheet">${t.tabs[key]} <span class="muted" style="font-weight:400">// ${esc(proj().card.projectId)}</span></h2>
    <div class="tablewrap"><table class="grid" id="sheetTable" data-sheet="${key}">
      <thead><tr>${head}</tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr class="totals">${totals.replace('<td></td>', `<td>${t.total}</td>`)}<td></td></tr></tfoot>
    </table></div>
    <div class="toolbar" style="margin-top:12px">${ro ? '' : `<button id="btnAddRow">${t.addRow}</button>`}</div>
  </div>${datalists(cfg.cols.filter(c=>c.ac).map(c=>key + '-' + c.k))}`;
}

/* ---- portfolio: every project at once ----
   The dashboard answers "how is THIS project doing". Nothing answered "how is
   the company doing", which is the question a portfolio of jobs actually
   raises — so this totals every project and reports the margin weighted by
   revenue rather than as an average of margins, which would let a tiny job
   with a freak percentage distort the whole picture. */
function pfState(){
  state.pf = state.pf || {client:'', from:'', to:'', sort:'projectId', dir:1};
  return state.pf;
}

/* A project counts as active in a window if its own dates OVERLAP that window,
   not merely start inside it — asking "what ran during Q1" should return the
   job that started in February and finished in April. */
function pfRows(){
  const f = pfState();
  const needle = (f.client||'').trim().toLowerCase();
  return state.projects.filter(p=>{
    if(needle){
      const hay = ((p.card.client||'') + ' ' + (p.card.site||'') + ' ' +
                   (p.card.projectId||'')).toLowerCase();
      if(hay.indexOf(needle) === -1) return false;
    }
    const st = p.card.start || '', en = p.card.end || '';
    if(f.from && (en || st || '9999-12-31') < f.from) return false;
    if(f.to   && (st || en || '0000-01-01') > f.to) return false;
    return true;
  }).map(p=>({p, d:computeDash(p)}));
}

function viewPortfolio(){
  const t = tr(), dd = t.dash, f = pfState();
  const all = state.projects.length;
  let rows = pfRows();

  const KEY = {
    projectId: r=>r.p.card.projectId||'', client: r=>r.p.card.client||'',
    site: r=>r.p.card.site||'', start: r=>r.p.card.start||'',
    rev: r=>r.d.revActual, cost: r=>r.d.costActual,
    profit: r=>r.d.profitActual, margin: r=>r.d.marginActual,
    modified: r=>lastEdited(r.p)
  };
  const get = KEY[f.sort] || KEY.projectId;
  rows = rows.slice().sort((a,b)=>{
    const x = get(a), y = get(b);
    const c = (typeof x === 'number' && typeof y === 'number') ? x-y : String(x).localeCompare(String(y));
    return c * f.dir;
  });

  const totals = portfolioTotals(rows);

  const th = (key, label, num) =>
    `<th class="${num?'num':''} pf-sort${f.sort===key?' on':''}" data-sort="${key}">${esc(label)}${
      f.sort===key ? `<span class="pf-arr">${f.dir>0?'\u2191':'\u2193'}</span>` : ''}</th>`;

  const body = rows.length ? rows.map(({p,d})=>{
    const days = projectDays(p.card);
    const on = d.marginActual >= d.target;
    /* data-label on every cell: stacked into a card on a phone, three bare
       numbers in a column say nothing about which is revenue and which is
       profit. The project number carries none -- it is the card's heading. */
    return `<tr data-open="${p.id}" style="cursor:pointer">
      <td class="pf-id"><b>${esc(p.card.projectId)||'—'}</b>${p.locked?` <span class="pf-chip lock">${t.locked}</span>`:''}</td>
      <td data-label="${esc(dd.client)}">${esc(p.card.client)||'—'}</td>
      <td data-label="${esc(dd.site)}">${esc(p.card.site)||'—'}</td>
      <td class="muted" data-label="${esc(t.card.start)}">${p.card.start||'—'}${days?` · ${days} ${dd.daysN}`:''}</td>
      <td class="num" data-label="${esc(dd.totalRevenue)}">${fmt(d.revActual)}</td>
      <td class="num" data-label="${esc(dd.totalCost)}">${fmt(d.costActual)}</td>
      <td class="num calc ${d.profitActual>=0?'pos':'neg'}" data-label="${esc(dd.grossProfit)}">${fmt(d.profitActual)}</td>
      <td class="num" data-label="${esc(dd.margin)}"><b>${pct(d.marginActual)}</b></td>
      <td data-label="${esc(dd.control)}"><span class="pf-chip ${on?'ok':'bad'}">${on?dd.onTarget:dd.belowTarget}</span></td>
      <td class="muted" data-label="${esc(t.modified)}" style="font-family:var(--mono);font-size:11px">${
        lastEdited(p) ? new Date(lastEdited(p)).toLocaleDateString(LOCALES[state.lang]) : t.never}</td>
    </tr>`;
  }).join('') : `<tr><td colspan="10" style="padding:26px;text-align:center" class="muted">${t.pfNone}</td></tr>`;

  /* The portfolio was a filtered list and nothing else, so the company's own
     position was only ever visible on paper, in the printed company report.
     The same figures and the same two charts belong on the screen: this tab is
     the company, the way the dashboard is the job. */
  const open = rows.filter(r => !r.p.locked).length;
  const onT  = rows.filter(r => r.d.marginActual >= r.d.target).length;
  const started = totals.some(g => g.rev > 0);

  const kpi = (label, big, note, tone) =>
    `<div class="co-kpi${tone ? ' ' + tone : ''}"><span>${esc(label)}</span><b>${big}</b>${
      note ? `<i>${note}</i>` : ''}</div>`;

  /* Actual once anything has been invoiced, plan before that -- and it says
     which it is showing rather than letting a plan pass for a result. */
  const money = totals.map(g => {
    const rev = started ? g.rev : g.revPlan, cost = started ? g.cost : g.costPlan;
    const prof = rev - cost, marg = rev ? prof / rev : 0;
    const basis = esc(started ? dd.actual : dd.plan);
    return kpi(`${esc(dd.totalRevenue)} ${esc(g.currency)}`, fmt(rev), basis) +
           kpi(dd.totalCost, fmt(cost), basis) +
           kpi(dd.grossProfit, fmt(prof), basis, prof >= 0 ? 'ok' : 'bad') +
           kpi(dd.margin, pct(marg), basis, marg >= 0 ? 'ok' : 'bad');
  }).join('');

  const summary = rows.length ? `<div class="card">
      <h2 class="sheet">${esc(t.companyTitle)}</h2>
      <div class="co-kpis">
        ${money}
        ${kpi(t.projectsN, rows.length, `${open} ${esc(t.openN)}`)}
        ${kpi(dd.onTarget, `${onT}/${rows.length}`, '&nbsp;', onT === rows.length ? 'ok' : '')}
      </div>
    </div>
    <div class="enq-charts">
      <!-- The title these helpers take goes into the SVG's aria-label, which a
           screen reader hears and nobody else does. On paper each of them sits
           under an h3; on screen they were two unlabelled bar charts. -->
      <div class="card"><h3 class="co-chart">${esc(t.marginByProject)}</h3>
        ${chartProjectMargins(rows, PAL_SCREEN, {title: t.marginByProject, empty: dd.noData})}</div>
      <div class="card"><h3 class="co-chart">${esc(t.revenueByClient)}</h3>
        ${chartByClient(rows, PAL_SCREEN, {title: t.revenueByClient, empty: dd.noData, unnamed: '—'})}</div>
    </div>` : '';

  return `${noticeBar()}${summary}<div class="card">
    <h2 class="sheet">${t.pfTitle} <span class="muted" style="font-weight:400">// ${
      t.showing} ${rows.length} ${t.of} ${all}</span></h2>
    <p class="hint" style="margin:-8px 0 14px">${t.pfLead}</p>

    <div class="pf-filters">
      <label>${t.fClient}<input type="search" id="pfClient" value="${esc(f.client)}"
        placeholder="${esc(t.fClient)} / ${esc(t.card.site)} / ${esc(t.card.projectId)}"></label>
      <label>${t.fFrom}<input type="date" id="pfFrom" value="${f.from}"></label>
      <label>${t.fTo}<input type="date" id="pfTo" value="${f.to}"></label>
      <button id="pfClear" class="ghost">${t.clearF}</button>
      <button id="pfCsv">${t.pfCsv}</button>
    </div>

    <div class="tablewrap"><table class="grid" id="pfTable">
      <thead><tr>
        ${th('projectId', t.card.projectId)}${th('client', t.card.client)}
        ${th('site', t.card.site)}${th('start', t.card.start)}
        ${th('rev', dd.totalRevenue, 1)}${th('cost', dd.totalCost, 1)}
        ${th('profit', dd.grossProfit, 1)}${th('margin', dd.margin, 1)}
        <th>${esc(dd.control)}</th>${th('modified', t.modified)}
      </tr></thead>
      <tbody>${body}</tbody>
      <tfoot>${totals.map(g=>`<tr class="totals">
        <td class="pf-id">${esc(t.pfTotal)} <span class="pf-cur">${esc(g.currency)}</span></td>
        <td></td><td></td><td></td>
        <td class="num" data-label="${esc(dd.totalRevenue)}">${fmt(g.rev)}</td>
        <td class="num" data-label="${esc(dd.totalCost)}">${fmt(g.cost)}</td>
        <td class="num" data-label="${esc(dd.grossProfit)}">${fmt(g.profit)}</td>
        <td class="num" data-label="${esc(dd.margin)}">${pct(g.margin)}</td>
        <td class="muted" style="font-weight:400">${esc(t.weighted)}</td><td></td>
      </tr>`).join('')}</tfoot>
    </table></div>
  </div>`;
}

/* Totals are grouped by CURRENCY, and that is a correctness fix rather than a
   presentation one. Two jobs of 100 000 -- one in EUR, one in USD -- produced
   a "Company total" of 200 000 of nothing at all, unlabelled, in the one view
   meant to be read as the company's position.

   Converting them would need a rate and the date it was taken, which is a
   decision for whoever signs the accounts, not something to guess at. So each
   currency is totalled on its own line: with a single currency this reads
   exactly as it did, plus the unit; with more than one it says so instead of
   inventing a number. The screen and the CSV share this, so they cannot drift
   apart into two different answers. */
/* Grouped by currency and never summed across them: adding euros to dollars
   produces a number that is wrong in a way nobody can see. Plan is carried
   alongside actual because a book of jobs that have not started yet is all
   plan, and an actual-only summary reads as a company that has done nothing. */
function portfolioTotals(rows){
  const by = new Map();
  rows.forEach(r=>{
    const cur = ((r.p.settings && r.p.settings.currency) || '').trim() || '—';
    const g = by.get(cur) || { currency: cur, rev: 0, cost: 0, revPlan: 0, costPlan: 0, n: 0 };
    g.rev += r.d.revActual; g.cost += r.d.costActual;
    g.revPlan += r.d.revPlan; g.costPlan += r.d.costPlan;
    g.n++;
    by.set(cur, g);
  });
  return [...by.values()]
    .sort((a, b) => a.currency.localeCompare(b.currency))
    .map(g => Object.assign(g, {
      profit: g.rev - g.cost, margin: g.rev ? (g.rev - g.cost) / g.rev : 0,
      profitPlan: g.revPlan - g.costPlan,
      marginPlan: g.revPlan ? (g.revPlan - g.costPlan) / g.revPlan : 0
    }));
}

/* Portfolio CSV: one row per project plus the company line, so the whole book
   goes to an accountant in a single file rather than one export per job. */
function exportPortfolioCsv(){
  if(!canMoney()) return;
  const t = tr(), dd = t.dash, rows = pfRows();
  const q = v => `"${String(v??'').replace(/\u00a0/g,' ').replace(/"/g,'""')}"`;
  const num = v => (v===null||v===undefined||isNaN(v)) ? '' : String(Math.round(v*100)/100).replace('.',',');
  const L = [];
  L.push([q('LITPROFIT'), q(t.pfTitle)].join(';'));
  L.push([q(t.showing), q(rows.length + ' / ' + state.projects.length)].join(';'));
  L.push('');
  L.push([t.card.projectId, t.card.client, t.card.site, t.card.start, t.card.end,
          t.card.days, t.card.currency, dd.totalRevenue, dd.totalCost, dd.grossProfit,
          dd.margin, dd.target, dd.control, t.modified].map(q).join(';'));
  rows.forEach(({p,d})=>{
    L.push([q(p.card.projectId), q(p.card.client), q(p.card.site),
            q(p.card.start), q(p.card.end), q(projectDays(p.card)??''),
            q(p.settings.currency),
            num(d.revActual), num(d.costActual), num(d.profitActual),
            q(pct(d.marginActual)), q(pct(d.target)),
            q(d.marginActual>=d.target ? dd.onTarget : dd.belowTarget),
            q(p.locked ? t.locked : '')].join(';'));
  });
  L.push('');
  portfolioTotals(rows).forEach(g=>{
    L.push([q(t.pfTotal + ' ' + g.currency), '', '', '', '', '', q(g.currency),
            num(g.rev), num(g.cost), num(g.profit),
            q(pct(g.margin)), '', q(t.weighted), ''].join(';'));
  });
  download('LITPROFIT_portfolio.csv', '\ufeff'+L.join('\r\n'), 'text/csv;charset=utf-8');
}

/* ---- dashboard ---- */
/* The cost categories, named once. Four charts and two reports draw these,
   and they must all agree on what "cost" is made of. */
function costCats(t, d){
  return [
    { l: t.dash.laborCost, p: d.laborPlan,  a: d.laborActual  },
    { l: t.tabs.subs,      p: d.subsPlan,   a: d.subsActual   },
    { l: t.tabs.travel,    p: d.travelPlan, a: d.travelActual },
    { l: t.tabs.materials, p: d.matPlan,    a: d.matActual    },
    { l: t.tabs.logistics, p: d.logPlan,    a: d.logActual    },
    { l: t.dash.adminOh,   p: d.adminPlan,  a: d.adminActual  }
  ];
}
/* revenue, every cost taken off it, and what survives */
function waterfallSteps(t, d){
  return [
    { l: t.dash.revenue, v: d.revActual, total: true },
    { l: t.dash.laborCost, v: -d.laborActual },
    { l: t.tabs.subs, v: -d.subsActual },
    { l: t.tabs.travel, v: -d.travelActual },
    { l: t.tabs.materials, v: -d.matActual },
    { l: t.tabs.logistics, v: -d.logActual },
    { l: t.dash.adminOh, v: -d.adminActual },
    { l: t.dash.profit, v: 0, total: true }
  ];
}

/* ============================================================
   ENQUIRY REGISTER
   ------------------------------------------------------------
   This screen replaces a Power BI report that was published to the web. Two
   things it does that the report could not: it is behind the same login and
   the same roles as the rest of the calculator, and it is writable, so the
   register stops being a spreadsheet that somebody has to remember to refresh.

   Both report pages are here on one screen -- the KPI cards and the register
   from page 1, the four analytics from page 2 -- because they answer the same
   question and flipping between two pages to read one number was the report's
   own worst habit.
   ============================================================ */
const ENQ_STATUSES = ['Vykdoma', 'Gautas PO', 'Atmesta užklausa'];

function enqState(){
  if(!state.enq) state.enq = {
    q:'', client:'', supplier:'', status:'', owner:'',
    toSupplier:'', quoted:'', paid:'', from:'', to:'', year:'', quick:'',
    sort:'date', dir:-1
  };
  return state.enq;
}

/* The report's own conditional formatting, kept: green for the thing that
   went right, red for the thing that did not, amber for the thing still
   moving. Reading it as colour is how this register is actually used. */
function enqTone(v){
  return v === 'Gautas PO' ? 'ok'
       : v === 'Atmesta užklausa' ? 'bad'
       : v === 'Vykdoma' ? 'wip' : '';
}

/* A named question, expressed once. Written as preset filter values instead
   these would fight whatever the dropdowns already say; as a predicate they
   stack on top of them, so "owed to us" narrowed to one client still means
   what it says. */
const ENQ_QUICK = {
  owed:    r => r.status === 'Gautas PO' && !r.paid,
  noquote: r => !r.quoted_to_client && r.status !== 'Atmesta užklausa',
  stale:   r => (r.days_unquoted || 0) > 30,
  nocost:  r => r.cost_ex_vat == null && (Number(r.price_ex_vat) || 0) > 0,
  won:     r => r.status === 'Gautas PO',
  month:   r => (r.enquiry_date || '').slice(0, 7) === new Date().toISOString().slice(0, 7)
};

function enqRows(){
  const f = enqState();
  const q = f.q.trim().toLowerCase();
  const quick = ENQ_QUICK[f.quick];
  return (state.enquiries || []).filter(r => {
    if(quick && !quick(r)) return false;
    if(q){
      const hay = [r.number, r.client, r.description, r.supplier, r.owner]
        .map(x => (x || '').toLowerCase()).join(' ');
      if(hay.indexOf(q) < 0) return false;
    }
    if(f.client   && r.client   !== f.client)   return false;
    if(f.supplier && r.supplier !== f.supplier) return false;
    if(f.status   && r.status   !== f.status)   return false;
    if(f.owner    && (r.owner || '') !== f.owner) return false;
    if(f.toSupplier && String(!!r.sent_to_supplier) !== f.toSupplier) return false;
    if(f.quoted     && String(!!r.quoted_to_client) !== f.quoted)     return false;
    if(f.paid       && String(!!r.paid)              !== f.paid)       return false;
    if(f.year && (r.enquiry_date || '').slice(0,4) !== f.year) return false;
    if(f.from && (!r.enquiry_date || r.enquiry_date < f.from)) return false;
    if(f.to   && (!r.enquiry_date || r.enquiry_date > f.to))   return false;
    return true;
  });
}

function enqSorted(rows){
  const f = enqState();
  const KEY = {
    number: r => r.number || '', client: r => r.client || '',
    description: r => r.description || '', date: r => r.enquiry_date || '',
    supplier: r => r.supplier || '', days: r => r.days_unquoted || 0,
    status: r => r.status || '', poDate: r => r.po_date || '',
    cost: r => r.cost_ex_vat == null ? -1 : Number(r.cost_ex_vat),
    price: r => Number(r.price_ex_vat) || 0,
    /* null sorts below every real margin rather than beside zero: "not known"
       and "made nothing" are different answers and must not interleave */
    margin: r => r.margin_eur == null ? -Infinity : Number(r.margin_eur),
    marginPct: r => r.margin_pct == null ? -Infinity : Number(r.margin_pct)
  };
  const get = KEY[f.sort] || KEY.date;
  return rows.slice().sort((a, b) => {
    const x = get(a), y = get(b);
    const c = (typeof x === 'number' && typeof y === 'number')
      ? x - y : String(x).localeCompare(String(y));
    return c * f.dir;
  });
}

/* One pass, so the KPI cards, the table foot and the report can never
   disagree about what is in scope. */
function enqTotals(rows){
  let sell = 0, cost = 0, margin = 0, costed = 0, sellCosted = 0, unpaid = 0, days = 0;
  rows.forEach(r => {
    sell += Number(r.price_ex_vat) || 0;
    days += r.days_unquoted || 0;
    if(r.cost_ex_vat != null){
      cost += Number(r.cost_ex_vat);
      margin += Number(r.margin_eur) || 0;
      /* The denominator for a margin percentage is the revenue it was earned
         on, not all revenue. Divided by the whole register the figure reads
         low by exactly the share of lines that have no supplier price yet --
         with a third of them costed it showed 5% where the real answer was
         nearer 33%, which is the kind of wrong somebody prices a job on. */
      sellCosted += Number(r.price_ex_vat) || 0;
      costed++;
    }
    /* Only a sale that has actually been sold can be outstanding. An enquiry
       that was rejected is not money anybody is waiting for. */
    if(!r.paid && r.status === 'Gautas PO') unpaid += Number(r.price_ex_vat) || 0;
  });
  return { sell, cost, margin, costed, sellCosted, unpaid, days,
           pct: sellCosted ? margin / sellCosted : null,
           /* what share of the register can answer the margin question at all */
           coverage: rows.length ? costed / rows.length : 0 };
}

function enqDistinct(key){
  const seen = new Set();
  (state.enquiries || []).forEach(r => { if(r[key]) seen.add(r[key]); });
  return [...seen].sort((a, b) => a.localeCompare(b));
}

/* Sum by a dimension, biggest first, with a long tail folded into one slice.
   The report drew 63 clients as 63 pie wedges, most of them a hairline, and a
   wedge you cannot see or read is not information. */
function enqGroup(rows, key, keep){
  const by = new Map();
  rows.forEach(r => {
    const k = r[key] || '—';
    by.set(k, (by.get(k) || 0) + (Number(r.price_ex_vat) || 0));
  });
  const all = [...by.entries()].map(([l, v]) => ({ l, v })).sort((a, b) => b.v - a.v);
  if(all.length <= keep) return all;
  const rest = all.slice(keep).reduce((a, x) => a + x.v, 0);
  return all.slice(0, keep).concat([{ l: '+' + (all.length - keep), v: rest }]);
}

function enqMonths(rows){
  const by = new Map();
  rows.forEach(r => {
    if(!r.enquiry_date) return;
    const k = r.enquiry_date.slice(0, 7);
    by.set(k, (by.get(k) || 0) + 1);
  });
  return [...by.entries()].sort((a, b) => a[0].localeCompare(b[0])).map(([l, v]) => ({ l, v }));
}

/* A plain column chart. The dashboard's helpers all draw money against a
   plan, which is not what a count per month is. */
function enqBars(items, opt){
  const o = opt || {};
  if(!items.length) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  const W = 560, H = 150, padL = 30, padB = 26, padT = 14;
  const max = Math.max(1, ...items.map(i => i.v));
  const bw = (W - padL - 10) / items.length;
  const bars = items.map((it, i) => {
    const h = (it.v / max) * (H - padT - padB);
    const x = padL + i * bw, y = H - padB - h;
    return `<rect x="${(x + bw * 0.18).toFixed(1)}" y="${y.toFixed(1)}"
        width="${(bw * 0.64).toFixed(1)}" height="${Math.max(1, h).toFixed(1)}"
        fill="var(--series-2)" rx="1"/>
      <text x="${(x + bw / 2).toFixed(1)}" y="${(y - 4).toFixed(1)}" font-size="9.5"
        fill="var(--ink-2)" text-anchor="middle">${it.v}</text>
      <text x="${(x + bw / 2).toFixed(1)}" y="${H - 8}" font-size="9.5"
        fill="var(--ink-3)" text-anchor="middle">${esc(o.short ? it.l.slice(-2) : it.l)}</text>`;
  }).join('');
  return `<figure class="chart"><figcaption>${esc(o.title || '')}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || '')}">
      <line x1="${padL}" y1="${H - padB}" x2="${W - 6}" y2="${H - padB}"
        stroke="var(--grid)" stroke-width="1"/>${bars}</svg></figure>`;
}

/* Sold against earned, month by month. The count-per-month chart says how busy
   the desk was; this one says whether the work was worth doing, which is a
   different question and the one the two price columns exist to answer. */
function enqMonthMoney(rows){
  const by = new Map();
  rows.forEach(r => {
    if(!r.enquiry_date) return;
    const k = r.enquiry_date.slice(0, 7);
    const o = by.get(k) || { sell: 0, margin: 0 };
    o.sell += Number(r.price_ex_vat) || 0;
    if(r.margin_eur != null) o.margin += Number(r.margin_eur);
    by.set(k, o);
  });
  return [...by.entries()].sort((a, b) => a[0].localeCompare(b[0]))
    .map(([l, o]) => ({ l, a: o.sell, b: o.margin }));
}

/* How long the money has been owed, in the buckets a debtor list is read in.
   Only enquiries with a PO: nobody is waiting on a rejected quote. */
function enqAgeing(rows, t){
  const e = t.enq, today = new Date();
  const buckets = [
    { l: e.b30,  max: 30,       v: 0 },
    { l: e.b60,  max: 60,       v: 0 },
    { l: e.b90,  max: 90,       v: 0 },
    { l: e.b90p, max: Infinity, v: 0 }
  ];
  rows.forEach(r => {
    if(r.paid || r.status !== 'Gautas PO') return;
    const from = r.po_date || r.enquiry_date;
    if(!from) return;
    const days = Math.max(0, Math.round((today - new Date(from)) / 86400000));
    (buckets.find(b => days <= b.max) || buckets[3]).v += Number(r.price_ex_vat) || 0;
  });
  return buckets;
}

/* Two series side by side. enqBars draws one; a second one over the top of it
   would just hide the shorter series. */
function enqBars2(items, opt){
  const o = opt || {};
  if(!items.length) return `<p class="chart-empty">${esc(o.empty || '')}</p>`;
  const W = 560, H = 168, padL = 34, padB = 28, padT = 14;
  const max = Math.max(1, ...items.map(i => Math.max(i.a, i.b)));
  const gw = (W - padL - 10) / items.length;
  const bw = gw * 0.33;
  const bars = items.map((it, i) => {
    const x = padL + i * gw + gw * 0.1;
    const ha = (it.a / max) * (H - padT - padB), hb = (it.b / max) * (H - padT - padB);
    return `<rect x="${x.toFixed(1)}" y="${(H - padB - ha).toFixed(1)}" width="${bw.toFixed(1)}"
        height="${Math.max(1, ha).toFixed(1)}" fill="var(--series-1)" rx="1"/>
      <rect x="${(x + bw + 2).toFixed(1)}" y="${(H - padB - hb).toFixed(1)}" width="${bw.toFixed(1)}"
        height="${Math.max(1, hb).toFixed(1)}" fill="var(--series-2)" rx="1"/>
      <text x="${(x + bw).toFixed(1)}" y="${H - 9}" font-size="9.5" fill="var(--ink-3)"
        text-anchor="middle">${esc(String(it.l).slice(-2))}</text>`;
  }).join('');
  return `<figure class="chart"><figcaption>${esc(o.title || '')}</figcaption>
    <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.title || '')}">
      <line x1="${padL}" y1="${H - padB}" x2="${W - 6}" y2="${H - padB}"
        stroke="var(--grid)" stroke-width="1"/>${bars}</svg>
    <div class="legend"><span><i style="background:var(--series-1)"></i>${esc(o.a || '')}</span>
      <span><i style="background:var(--series-2)"></i>${esc(o.b || '')}</span></div></figure>`;
}

function viewEnquiries(){
  const t = tr(), e = t.enq, L = LOCALES[state.lang];
  const all = (state.enquiries || []).length;
  const rows = enqSorted(enqRows());

  const T = enqTotals(rows);
  const kpi = (label, n, tone, note) =>
    `<div class="enq-kpi${tone ? ' ' + tone : ''}"><b>${n}</b><span>${esc(label)}</span>${
      note ? `<i>${esc(note)}</i>` : ''}</div>`;
  const count = st => rows.filter(r => r.status === st).length;
  /* An em dash, not 0.00. A line with no supplier price has an unknown margin,
     and printing zero there would report every historic row as a job done for
     nothing. */
  const money = v => v == null ? '<span class="muted">&mdash;</span>' : fmt(v);

  const th = (key, label, num) =>
    `<th class="${num ? 'num' : ''} pf-sort${enqState().sort === key ? ' on' : ''}"
       data-esort="${key}">${esc(label)}${enqState().sort === key
        ? `<span class="pf-arr">${enqState().dir > 0 ? '↑' : '↓'}</span>` : ''}</th>`;

  const flag = (on, yes, no) =>
    `<span class="enq-flag ${on ? 'ok' : 'bad'}">${esc(on ? yes : no)}</span>`;

  const body = rows.length ? rows.map(r => `<tr data-enq="${esc(r.id)}" style="cursor:pointer">
      <td class="pf-id"><b>${esc(r.number)}</b></td>
      <td data-label="${esc(e.client)}">${esc(r.client) || '—'}</td>
      <td data-label="${esc(e.description)}">${esc(r.description) || '—'}</td>
      <td class="muted" data-label="${esc(e.date)}">${
        r.enquiry_date ? new Date(r.enquiry_date).toLocaleDateString(L) : '—'}</td>
      <td data-label="${esc(e.toSupplier)}">${flag(r.sent_to_supplier, t.yes, t.no)}</td>
      <td data-label="${esc(e.supplier)}">${esc(r.supplier) || '—'}</td>
      <td data-label="${esc(e.quoted)}">${flag(r.quoted_to_client, t.yes, t.no)}</td>
      <td class="num" data-label="${esc(e.daysUnquoted)}">${
        r.days_unquoted ? `<b class="enq-age">${r.days_unquoted}</b>` : '0'}</td>
      <td data-label="${esc(e.status)}"><span class="enq-flag ${enqTone(r.status)}">${
        esc(e.st[r.status] || r.status)}</span></td>
      <td class="muted" data-label="${esc(e.poDate)}">${
        r.po_date ? new Date(r.po_date).toLocaleDateString(L) : '—'}</td>
      <td class="num enq-edit" data-edit="cost" data-label="${esc(e.cost)}"
          title="${esc(e.clickToEdit)}">${money(r.cost_ex_vat)}</td>
      <td class="num" data-label="${esc(e.sell)}">${fmt(Number(r.price_ex_vat) || 0)}</td>
      <td class="num calc ${r.margin_eur == null ? '' : (r.margin_eur >= 0 ? 'pos' : 'neg')}"
          data-label="${esc(e.margin)}">${money(r.margin_eur)}</td>
      <td class="num" data-label="${esc(e.marginPct)}">${
        r.margin_pct == null ? '<span class="muted">&mdash;</span>' : pct(Number(r.margin_pct))}</td>
      <td data-label="${esc(e.delivery)}">${flag(r.delivered, e.delivered, e.undelivered)}</td>
      <td class="enq-edit" data-edit="paid" data-label="${esc(e.paid)}"
          title="${esc(e.clickToEdit)}">${flag(r.paid, e.paid, e.unpaid)}</td>
    </tr>`).join('')
    : `<tr><td colspan="12" style="padding:26px;text-align:center" class="muted">${esc(e.none)}</td></tr>`;

  const quick = (k, label) =>
    `<button class="enq-chip${enqState().quick === k ? ' on' : ''}" data-quick="${k}">${esc(label)}</button>`;

  const sel = (id, label, opts, val) =>
    `<label>${esc(label)}<select id="${id}"><option value="">${esc(e.all)}</option>${
      opts.map(o => `<option value="${esc(o.v)}"${o.v === val ? ' selected' : ''}>${esc(o.l)}</option>`).join('')
    }</select></label>`;

  const years = [...new Set((state.enquiries || [])
    .map(r => (r.enquiry_date || '').slice(0, 4)).filter(Boolean))].sort().reverse();

  return `${noticeBar()}<div class="card">
    <h2 class="sheet">${esc(e.title)} <span class="muted" style="font-weight:400">// ${
      t.showing} ${rows.length} ${t.of} ${all}</span></h2>
    <p class="hint" style="margin:-8px 0 14px">${esc(e.lead)}</p>

    <div class="enq-kpis">
      ${kpi(e.kReceived, rows.length, '')}
      ${kpi(e.kPO, count('Gautas PO'), 'ok')}
      ${kpi(e.kProgress, count('Vykdoma'), 'wip')}
      ${kpi(e.kRejected, count('Atmesta užklausa'), 'bad')}
    </div>
    <div class="enq-kpis enq-kpis--money">
      ${kpi(e.kTurnover, fmt(T.sell, 0), '')}
      ${kpi(e.kCost, T.costed ? fmt(T.cost, 0) : '—', '')}
      ${kpi(e.kMargin, T.costed ? fmt(T.margin, 0) : '—', T.margin >= 0 ? 'ok' : 'bad',
            T.costed ? (T.pct == null ? '' : pct(T.pct)) : e.noCost)}
      ${kpi(e.kUnpaid, fmt(T.unpaid, 0), T.unpaid > 0 ? 'wip' : 'ok')}
    </div>
    ${(() => {
      /* Win rate over DECIDED enquiries. Counting the ones still in progress
         as losses reports a collapsing hit rate every time the desk gets busy. */
      const won = count('Gautas PO'), lost = count('Atmesta užklausa'), decided = won + lost;
      return decided ? `<p class="enq-rate"><b>${pct(won / decided)}</b> ${esc(e.winRate)}
        <span class="muted">// ${won} / ${decided} ${esc(e.ofDecided)}</span></p>` : '';
    })()}

    <div class="pf-filters enq-filters">
      <label>${esc(e.search)}<input type="search" id="enqQ" value="${esc(enqState().q)}"
        placeholder="${esc(e.searchPh)}"></label>
      ${sel('enqClient', e.client, enqDistinct('client').map(v => ({v, l: v})), enqState().client)}
      ${sel('enqSupplier', e.supplier, enqDistinct('supplier').map(v => ({v, l: v})), enqState().supplier)}
      ${sel('enqStatus', e.status, ENQ_STATUSES.map(v => ({v, l: e.st[v] || v})), enqState().status)}
      ${sel('enqToSupplier', e.toSupplier, [{v:'true',l:t.yes},{v:'false',l:t.no}], enqState().toSupplier)}
      ${sel('enqQuoted', e.quoted, [{v:'true',l:t.yes},{v:'false',l:t.no}], enqState().quoted)}
      ${sel('enqPaid', e.paid, [{v:'true',l:e.paid},{v:'false',l:e.unpaid}], enqState().paid)}
      ${sel('enqYear', e.date, years.map(v => ({v, l: v})), enqState().year)}
      <button id="enqClear" class="ghost">${t.clearF}</button>
      <button id="enqCsv">${esc(e.csv)}</button>
      <!-- The report was only in the overflow menu, which is where things go
           to not be found. A register that cannot be handed to somebody on
           paper is half a tool. -->
      <button id="enqPdf">${esc(e.report)} ${esc(e.pdf)}</button>
      <button id="enqAdd" class="primary">${esc(e.add)}</button>
    </div>

    <!-- The five questions this register is actually opened to answer. Each
         one is two or three filters that nobody sets by hand twice. -->
    <div class="enq-quick">
      <span>${esc(e.quick)}</span>
      ${quick('owed', e.qOwed)}${quick('noquote', e.qNoQuote)}${quick('stale', e.qStale)}
      ${quick('nocost', e.qNoCost)}${quick('won', e.qWon)}${quick('month', e.qMonth)}
      <i class="enq-tip">${esc(e.clickToEdit)}</i>
    </div>

    <div class="tablewrap"><table class="grid" id="enqTable">
      <thead><tr>
        ${th('number', e.number)}${th('client', e.client)}${th('description', e.description)}
        ${th('date', e.date)}<th>${esc(e.toSupplier)}</th>${th('supplier', e.supplier)}
        <th>${esc(e.quoted)}</th>${th('days', e.daysUnquoted, 1)}${th('status', e.status)}
        ${th('poDate', e.poDate)}${th('cost', e.cost, 1)}${th('price', e.sell, 1)}
        ${th('margin', e.margin, 1)}${th('marginPct', e.marginPct, 1)}
        <th>${esc(e.delivery)}</th><th>${esc(e.paid)}</th>
      </tr></thead>
      <tbody>${body}</tbody>
      <tfoot><tr class="totals">
        <td class="pf-id">${esc(e.total)}</td><td></td><td></td><td></td><td></td><td></td><td></td>
        <td class="num">${T.days}</td><td></td><td></td>
        <td class="num">${T.costed ? fmt(T.cost) : '&mdash;'}</td>
        <td class="num">${fmt(T.sell)}</td>
        <td class="num">${T.costed ? fmt(T.margin) : '&mdash;'}</td>
        <td class="num">${T.pct == null || !T.costed ? '&mdash;' : pct(T.pct)}</td>
        <td></td><td></td>
      </tr></tfoot>
    </table></div>
  </div>

  <div class="enq-charts">
    <div class="card">${chartComposition(enqGroup(rows, 'client', 8), PAL_SCREEN,
      {title: e.byClient, empty: e.none})}</div>
    <div class="card">${chartComposition(enqGroup(rows, 'supplier', 8), PAL_SCREEN,
      {title: e.bySupplier, empty: e.none})}</div>
  </div>
  <div class="enq-charts">
    <div class="card">${enqBars(enqMonths(rows), {title: e.byMonth, empty: e.none, short: true})}</div>
    <div class="card">${enqBars(ENQ_STATUSES.map(st => ({l: e.st[st] || st, v: count(st)})),
      {title: e.byStatus, empty: e.none})}</div>
  </div>
  <div class="enq-charts">
    <div class="card">${enqBars2(enqMonthMoney(rows),
      {title: e.byMonthMoney, empty: e.none, a: e.sell, b: e.margin})}</div>
    <div class="card">${enqBars(enqAgeing(rows, t).map(b => ({l: b.l, v: Math.round(b.v)})),
      {title: e.ageingBuckets, empty: e.none})}</div>
  </div>`;
}

/* ---- enquiry register: events, editing, export ---- */
function wireEnquiries(){
  const t = tr(), e = t.enq, f = enqState();
  const on = (id, ev, fn) => { const el = $('#' + id); if(el) el.addEventListener(ev, fn); };
  const set = (k, v) => { f[k] = v; persist(); render(); };

  /* typing re-renders the whole table, so the caret has to be put back --
     without this the field loses focus on the first keystroke and the second
     one goes to the document */
  on('enqQ', 'input', ev => {
    const pos = ev.target.selectionStart;
    f.q = ev.target.value;
    render();
    const again = $('#enqQ');
    if(again){ again.focus(); try { again.setSelectionRange(pos, pos); } catch(_){} }
  });
  on('enqClient',     'change', ev => set('client', ev.target.value));
  on('enqSupplier',   'change', ev => set('supplier', ev.target.value));
  on('enqStatus',     'change', ev => set('status', ev.target.value));
  on('enqToSupplier', 'change', ev => set('toSupplier', ev.target.value));
  on('enqQuoted',     'change', ev => set('quoted', ev.target.value));
  on('enqPaid',       'change', ev => set('paid', ev.target.value));
  on('enqYear',       'change', ev => set('year', ev.target.value));
  on('enqClear', 'click', () => {
    state.enq = null; persist(); render();
  });
  on('enqAdd', 'click', () => enqEdit(null));
  on('enqCsv', 'click', () => enqCsv());
  on('enqPdf', 'click', () => printEnquiryReport());

  document.querySelectorAll('.enq-chip').forEach(b => b.addEventListener('click', () => {
    /* clicking the chip that is already on turns it off, so the same button
       is the way back out */
    f.quick = f.quick === b.dataset.quick ? '' : b.dataset.quick;
    render();
  }));

  const table = $('#enqTable');
  if(table){
    table.querySelectorAll('[data-esort]').forEach(th => th.addEventListener('click', () => {
      const k = th.dataset.esort;
      if(f.sort === k) f.dir = -f.dir; else { f.sort = k; f.dir = 1; }
      render();
    }));
    table.querySelectorAll('tr[data-enq]').forEach(tr_ => tr_.addEventListener('click', ev => {
      /* the two editable cells handle themselves; without this the row's own
         handler opens the dialog on top of the cell you just clicked */
      if(ev.target.closest('.enq-edit')) return;
      const row = (state.enquiries || []).find(r => r.id === tr_.dataset.enq);
      if(row) enqEdit(row);
    }));

    table.querySelectorAll('.enq-edit').forEach(td => td.addEventListener('click', ev => {
      ev.stopPropagation();
      const row = (state.enquiries || []).find(r => r.id === td.closest('tr').dataset.enq);
      if(!row) return;
      if(td.dataset.edit === 'paid') enqPatch(row, { paid: !row.paid });
      else enqCostCell(td, row);
    }));
  }
}

/* One dialog for both new and existing. `row` null means new. */
